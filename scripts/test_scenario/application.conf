# Hyperbolic Time Chamber - Quick Test
# Generated: 2026-02-07T11:07:53.281040

include "application.conf"

htc {
  simulation {
    name = "Quick Test"
    description = "Quick test scenario for development"
    
    # Time configuration
    startTick = 0
    endTick = 600
    tickDuration = 1.0
    
    # Data sources
    actorsDataSources = [
      {
        id = "nodes"
        classType = "hybrid.actor.Node"
        creationType = "LoadBalancedDistributed"
        dataSource {
          type = "json"
          info {
            path = "${htc.simulation.dataPath}/data/nodes.json"
          }
        }
      },
      {
        id = "links"
        classType = "hybrid.actor.Link"
        creationType = "LoadBalancedDistributed"
        dataSource {
          type = "json"
          info {
            path = "${htc.simulation.dataPath}/data/links.json"
          }
        }
      },
      {
        id = "vehicles"
        classType = "hybrid.actor.Car"  # Mixed vehicle types
        creationType = "LoadBalancedDistributed"
        dataSource {
          type = "json"
          info {
            path = "${htc.simulation.dataPath}/data/vehicles.json"
          }
        }
      },
      {
        id = "traffic_signals"
        classType = "hybrid.actor.TrafficSignal"
        creationType = "LoadBalancedDistributed"
        dataSource {
          type = "json"
          info {
            path = "${htc.simulation.dataPath}/data/traffic_signals.json"
          }
        }
      }
    ]
    
    # City map
    cityMapFile = "${htc.simulation.dataPath}/data/city_map.json"
  }
  
  # Hybrid simulation parameters
  hybrid {
    microTimeStep = 0.1  # seconds
    microTicksPerGlobalTick = 10
    defaultCarFollowingModel = "krauss"
  }
}
