# Complete Migration Configuration
# Migrates mobility model (MESO-only) to hybrid model (MICRO/MESO)
# This configuration demonstrates ALL available options

# Input/Output directories
input_dir: "./input/cenario_1000_viagens"
output_dir: "./output/hybrid_1000_viagens"

# Hybrid link configuration
# IMPORTANT: ALL links get MICRO fields regardless of micro_link_ratio
# The ratio only controls the DEFAULT simulationMode (can change at runtime via API)
micro_link_ratio: 0.3  # 30% of links START in MICRO mode (rest are MESO but have MICRO fields)
micro_selection_strategy: "arterial"  # Options: random, arterial, highway
micro_time_step: 0.1  # seconds (sub-tick duration)
micro_ticks_per_global_tick: 10

# Vehicle type conversion (PRIVATE VEHICLES ONLY)
# Buses and subways are generated separately as public transport
convert_vehicles: true
vehicle_conversion_ratios:
  car: 0.80       # 80% remain cars
  bicycle: 0.10   # 10% become bicycles
  motorcycle: 0.10  # 10% become motorcycles
  # Note: No bus ratio - buses generated as public transport

# Public transport generation (separate from vehicle conversion)
generate_public_transport: true

# Bus system configuration
bus_stop_coverage: 0.15  # 15% of nodes get bus stops
num_bus_routes: 5        # Number of bus routes to generate
buses_per_route: [3, 8]  # Min/max buses per route
bus_stops_per_route: [5, 15]  # Min/max stops per route
bus_capacity: 80         # Passenger capacity per bus

# Subway system configuration
subway_station_coverage: 0.05  # 5% of nodes get subway stations
num_subway_routes: 3           # Number of subway lines to generate
trains_per_route: [2, 5]       # Min/max trains per line
subway_stations_per_route: [4, 10]  # Min/max stations per line
subway_capacity: 200           # Passenger capacity per train

# Person actor generation
generate_persons: true
persons_per_vehicle: 2.0  # Average 2 persons generated per vehicle trip

# File splitting (for large scenarios)
items_per_file: 5000  # Maximum items per JSON file

# Traffic signal generation
generate_traffic_signals: true
signal_coverage_ratio: 0.25  # 25% of nodes will have traffic signals

# Other options
random_seed: 42
preserve_ids: true
verbose: true

