# MICRO-Intensive Migration Configuration
# Creates a scenario with many MICRO links for detailed simulation
# Note: ALL links get MICRO fields, this ratio only affects DEFAULT mode

input_dir: "./input/cenario_1000_viagens"
output_dir: "./output/hybrid_micro_intensive"

# High MICRO ratio for detailed simulation
micro_link_ratio: 0.6  # 60% START in MICRO mode (rest MESO but ready to switch)
micro_selection_strategy: "arterial"  # Focus on important roads
micro_time_step: 0.1
micro_ticks_per_global_tick: 10

# Full vehicle type diversity (private vehicles only)
convert_vehicles: true
vehicle_conversion_ratios:
  car: 0.70
  bicycle: 0.15
  motorcycle: 0.15

# Comprehensive public transport system
generate_public_transport: true
bus_stop_coverage: 0.20  # 20% of nodes
num_bus_routes: 8
buses_per_route: [4, 10]
subway_station_coverage: 0.08  # 8% of nodes
num_subway_routes: 4
trains_per_route: [3, 6]

# More persons for realistic testing
generate_persons: true
persons_per_vehicle: 2.5

# Split into smaller files for better loading
items_per_file: 2000

# Many traffic signals for realistic intersections
generate_traffic_signals: true
signal_coverage_ratio: 0.4  # 40% of nodes

random_seed: 123
verbose: true

