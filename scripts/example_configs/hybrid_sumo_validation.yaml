repo_root: /home/dean/PhD/hyperbolic-time-chamber

# Input scenario in legacy mobility format
mobility_input_dir: /home/dean/PhD/hyperbolic-time-chamber/scripts/input/cenario_1000_viagens

# Name used for both generated scenarios
scenario_name: htc_scenario

# Pipeline artifacts (generated SUMO, reports, comparisons)
workspace_output_dir: /home/dean/PhD/hyperbolic-time-chamber/scripts/output/validation_runs

# Mandatory HTC runtime root (requested)
htc_input_root: /home/dean/hyperbolic-time-chamber/simulations/input

# HTC report root used by comparison stage
htc_reports_root: /home/dean/hyperbolic-time-chamber/output/reports/json
htc_report_subdir: sumo_run

# Scenario alignment
sumo_end_time: 300
micro_ratio: 1.0
micro_strategy: random
generate_public_transport: false
generate_persons: false
generate_traffic_signals: false

# Pipeline control
run_sumo: true
run_htc: true
compare: true

# HTC run monitor
# If omitted, runner defaults to sumo_end_time
htc_target_tick: 300
htc_timeout_sec: 2400
htc_first_event_timeout_sec: 0
htc_no_progress_sec: 180
require_htc_termination_log: false

clean_output: true