# Micro-Intensive Scenario Configuration
# Most links are MICRO for detailed simulation

name: "MICRO Intensive Test"
description: "Scenario with 90% MICRO links for detailed vehicle dynamics testing"
output_dir: "../simulations/input/micro_intensive_scenario"

# Simulation parameters
start_tick: 0
end_tick: 600  # 10 minutes (shorter for intensive MICRO)
tick_duration: 1.0

# Network configuration
network_type: "grid"
num_nodes: 9  # 3x3 grid
grid_size: 200.0  # Shorter links for micro simulation
base_latitude: -23.5505
base_longitude: -46.6333

# Link parameters
default_lanes: 2
default_speed_limit: 40.0  # km/h (urban)
default_capacity: 1200.0  # vehicles/hour/lane
micro_link_ratio: 0.9  # 90% MICRO links!

# Vehicle parameters
num_vehicles: 30  # Lower count for detailed observation
vehicle_distribution:
  car: 0.8
  bus: 0.1
  bicycle: 0.05
  motorcycle: 0.05

# Random seed
random_seed: 777
verbose: true
