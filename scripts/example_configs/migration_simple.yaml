# Simple Migration Configuration
# Basic migration with minimal changes
# Note: ALL links get MICRO fields regardless of micro_link_ratio

input_dir: "./input/cenario_1000_viagens"
output_dir: "./output/hybrid_simple"

# Keep most links in MESO mode by default (but all prepared for runtime switching)
micro_link_ratio: 0.2  # 20% START in MICRO mode
micro_selection_strategy: "random"
micro_time_step: 0.1
micro_ticks_per_global_tick: 10

# Minimal vehicle conversion
convert_vehicles: true
vehicle_conversion_ratios:
  car: 0.90
  bicycle: 0.05
  motorcycle: 0.05

# Basic public transport
generate_public_transport: true
bus_stop_coverage: 0.10
num_bus_routes: 2
subway_station_coverage: 0.03
num_subway_routes: 1

# Basic person generation
generate_persons: true
persons_per_vehicle: 1.5

# No traffic signals
generate_traffic_signals: false

items_per_file: 10000
verbose: true

