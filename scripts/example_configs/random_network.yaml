# Random Network Scenario Configuration
# Irregular network topology for testing routing

name: "Random Network Hybrid Test"
description: "Random network topology with irregular connections"
output_dir: "../simulations/input/random_network_scenario"

# Simulation parameters
start_tick: 0
end_tick: 3600  # 1 hour
tick_duration: 1.0

# Network configuration
network_type: "random"
num_nodes: 20
grid_size: 600.0  # Maximum connection distance
base_latitude: -23.5505
base_longitude: -46.6333

# Link parameters
default_lanes: 2
default_speed_limit: 50.0  # km/h
default_capacity: 1500.0  # vehicles/hour/lane
micro_link_ratio: 0.5  # 50% MICRO for testing

# Vehicle parameters
num_vehicles: 150
vehicle_distribution:
  car: 0.6
  bus: 0.2
  bicycle: 0.1
  motorcycle: 0.1

# Random seed
random_seed: 99999
verbose: true
