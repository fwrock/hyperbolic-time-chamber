# Large Grid Scenario Configuration
# 5x5 grid with realistic traffic volumes

name: "Large Grid Hybrid Scenario"
description: "Large 5x5 grid scenario with high traffic volume"
output_dir: "../simulations/input/large_grid_scenario"

# Simulation parameters
start_tick: 0
end_tick: 7200  # 2 hours
tick_duration: 1.0

# Network configuration
network_type: "grid"
num_nodes: 25  # 5x5 grid
grid_size: 500.0  # 500 meters between nodes
base_latitude: -23.5505
base_longitude: -46.6333

# Link parameters
default_lanes: 3
default_speed_limit: 60.0  # km/h
default_capacity: 2000.0  # vehicles/hour/lane
micro_link_ratio: 0.3  # 30% of links are MICRO (central business district)

# Vehicle parameters
num_vehicles: 500
vehicle_distribution:
  car: 0.65
  bus: 0.15
  bicycle: 0.1
  motorcycle: 0.1

# Random seed
random_seed: 12345
verbose: true
