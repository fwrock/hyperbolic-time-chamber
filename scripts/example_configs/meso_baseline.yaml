# Meso Baseline Scenario Configuration
# Pure mesoscopic simulation for baseline comparison

name: "MESO Baseline"
description: "Pure mesoscopic simulation for performance baseline"
output_dir: "../simulations/input/meso_baseline_scenario"

# Simulation parameters
start_tick: 0
end_tick: 7200  # 2 hours
tick_duration: 1.0

# Network configuration
network_type: "grid"
num_nodes: 25  # 5x5 grid
grid_size: 500.0
base_latitude: -23.5505
base_longitude: -46.6333

# Link parameters
default_lanes: 3
default_speed_limit: 60.0  # km/h
default_capacity: 2000.0  # vehicles/hour/lane
micro_link_ratio: 0.0  # 0% MICRO - pure MESO!

# Vehicle parameters
num_vehicles: 1000  # High volume for performance testing
vehicle_distribution:
  car: 0.7
  bus: 0.15
  bicycle: 0.1
  motorcycle: 0.05

# Random seed
random_seed: 11111
verbose: true
