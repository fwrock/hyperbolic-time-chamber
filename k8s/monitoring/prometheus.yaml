# ─────────────────────────────────────────────────────────────────
# Prometheus — coleta métricas de:
#   • Pods HTC (porta 9001 — métricas JVM + Pekko + simulação)
#   • Node Exporter (CPU, memória, rede, disco por nó)
#   • kube-state-metrics (estado dos pods K8s)
#   • Próprios componentes Kubernetes (API server, kubelet, cAdvisor)
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s

    # ── Regras de alerta (alertas de desempenho para experimentos) ─
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:

      # ── 1. Pods HTC: métricas da simulação (porta 9001) ──────────
      - job_name: 'htc-simulation'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          # Filtrar apenas pods HTC
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: htc-node
            action: keep
          # Usar a porta de métricas
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9001"
            action: keep
          # Labels úteis para identificar pod/nó
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # ── 2. Node Exporter: CPU, memória, rede, disco por nó ───────
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ── 3. kube-state-metrics: estado dos pods/deployments K8s ───
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      # ── 4. cAdvisor: CPU, memória e REDE por container (via kubelet) ─
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        # Map cAdvisor container labels to standard pod/namespace labels
        # so Grafana queries like {namespace="default", pod=~"htc-.*"} work.
        # IMPORTANT: use regex: (.+) to only replace when source label is non-empty.
        # Network metrics (container_network_*) are per-pod and may NOT have
        # container_label_* labels — without the regex guard, we'd overwrite
        # the native pod/namespace labels with empty strings.
        metric_relabel_configs:
          - source_labels: [container_label_io_kubernetes_pod_namespace]
            regex: (.+)
            target_label: namespace
          - source_labels: [container_label_io_kubernetes_pod_name]
            regex: (.+)
            target_label: pod
          - source_labels: [container_label_io_kubernetes_container_name]
            regex: (.+)
            target_label: container

      # ── 5. Prometheus self-monitoring ────────────────────────────
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

  # ── Regras de alerta para experimentos de desempenho ─────────────
  htc_alerts.yml: |
    groups:
      - name: htc_performance
        rules:
          - alert: HighMemoryUsage
            expr: |
              (jvm_memory_bytes_used{area="heap"} /
               jvm_memory_bytes_max{area="heap"}) > 0.85
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} usando >85% de heap JVM"

          - alert: HighCPUUsage
            expr: |
              rate(process_cpu_seconds_total[2m]) > 0.9
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} com CPU acima de 90%"

          - alert: KafkaConsumerLag
            expr: |
              kafka_consumer_lag_sum > 100000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Lag de consumer Kafka alto no pod {{ $labels.pod }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=14d"   # 14 dias de histórico
            - "--web.enable-lifecycle"
            - "--web.enable-admin-api"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: rules
          configMap:
            name: prometheus-config
            items:
              - key: htc_alerts.yml
                path: htc_alerts.yml
        - name: storage
          emptyDir: {}   # Para persistência real, use PVC com standard-rwo
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
