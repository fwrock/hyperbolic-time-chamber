# ─────────────────────────────────────────────────────────────────
# Node Exporter — GKE AUTOPILOT compatible
#
# Autopilot blocks: hostPID, hostNetwork, hostPath (except /var/log/).
# Node-level metrics (CPU, memory, network) are available via:
#   • cAdvisor embedded in kubelet (already scraped by prometheus.yaml)
#   • container_network_* metrics carry pod+node labels
#
# This file deploys a minimal node-exporter WITHOUT host mounts,
# running as an unprivileged container inside the pod network.
# It provides:
#   • JVM / process metrics scoped to its own container (limited)
#   • A placeholder so the prometheus "node-exporter" service exists
#
# For full node-level network metrics on Autopilot, use GKE Managed
# Prometheus or read from cAdvisor metrics already scraped:
#   container_network_receive_bytes_total
#   container_network_transmit_bytes_total
#   container_network_receive_packets_total  (etc.)
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9100"
    spec:
      # No hostPID / hostNetwork / hostPath — Autopilot compatible
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.0
          args:
            # Only collectors that don't require /proc or /sys host mounts
            - "--collector.disable-defaults"
            - "--collector.time"
            - "--collector.uname"
            - "--web.listen-address=:9100"
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            readOnlyRootFilesystem:   true
            runAsNonRoot:             true
            runAsUser:                65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    app: node-exporter
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
---
# ─────────────────────────────────────────────────────────────────
# kube-state-metrics — estado dos objetos K8s
#   (replicas desejadas vs. prontas, restarts, limites de recursos)
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: prometheus   # reutiliza o ClusterRole já criado
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: telemetry
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
    - name: telemetry
      port: 8081
      targetPort: 8081
