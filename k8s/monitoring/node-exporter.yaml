# ─────────────────────────────────────────────────────────────────
# Node Exporter — GKE Autopilot Compatible Version
#
# ⚠️  AUTOPILOT LIMITATIONS:
# - hostPID, hostNetwork, and most hostPath volumes are BLOCKED
# - Node-level metrics require host access (not available in Autopilot)
# - This deployment is DISABLED by default (replicas: 0)
#
# ALTERNATIVES FOR AUTOPILOT:
# 1. Use GKE Managed Prometheus (GMP) - includes node metrics:
#    https://cloud.google.com/stackdriver/docs/managed-prometheus
# 2. Use cAdvisor metrics (already available via kubelet)
# 3. Switch to GKE Standard cluster for full node-exporter
#
# TO ENABLE (will have limited metrics):
# - Set replicas to 1 in the Deployment below
# - Remove collectors that require host access
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  replicas: 0  # DISABLED - set to 1 to enable with limited metrics
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9100"
    spec:
      # Autopilot-compatible settings (no host access)
      hostPID:     false  # CHANGED: not allowed in Autopilot
      hostNetwork: false  # CHANGED: not allowed in Autopilot
      hostIPC:     false
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.0
          args:
            # Disable collectors that require host access
            - "--no-collector.arp"
            - "--no-collector.bcache"
            - "--no-collector.bonding"
            - "--no-collector.conntrack"
            - "--no-collector.cpu"
            - "--no-collector.cpufreq"
            - "--no-collector.diskstats"
            - "--no-collector.edac"
            - "--no-collector.entropy"
            - "--no-collector.filefd"
            - "--no-collector.hwmon"
            - "--no-collector.infiniband"
            - "--no-collector.ipvs"
            - "--no-collector.loadavg"
            - "--no-collector.mdadm"
            - "--no-collector.meminfo"
            - "--no-collector.netclass"
            - "--no-collector.netdev"
            - "--no-collector.netstat"
            - "--no-collector.nfs"
            - "--no-collector.nfsd"
            - "--no-collector.pressure"
            - "--no-collector.rapl"
            - "--no-collector.schedstat"
            - "--no-collector.sockstat"
            - "--no-collector.softnet"
            - "--no-collector.stat"
            - "--no-collector.thermal_zone"
            - "--no-collector.time"
            - "--no-collector.timex"
            - "--no-collector.udp_queues"
            - "--no-collector.uname"
            - "--no-collector.vmstat"
            - "--no-collector.xfs"
            - "--no-collector.zfs"
            # Only enable container-safe collectors
            - "--collector.textfile"
            - "--web.listen-address=:9100"
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      # NO hostPath volumes - not allowed in Autopilot except /var/log/
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    app: node-exporter
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
---
# ─────────────────────────────────────────────────────────────────
# RECOMMENDATION FOR GKE AUTOPILOT:
#
# Instead of node-exporter, use GKE Managed Prometheus (GMP):
#
# 1. Enable GMP in your cluster:
#    gcloud container clusters update CLUSTER_NAME \
#      --enable-managed-prometheus
#
# 2. Node metrics are automatically available via:
#    - kubelet/cadvisor (container metrics)
#    - GKE system metrics (node CPU, memory, disk, network)
#
# 3. Query metrics using PromQL:
#    - node_cpu_seconds_total
#    - node_memory_MemAvailable_bytes
#    - container_cpu_usage_seconds_total
#    - container_memory_working_set_bytes
#
# Learn more: https://cloud.google.com/stackdriver/docs/managed-prometheus
# ─────────────────────────────────────────────────────────────────
---
# ─────────────────────────────────────────────────────────────────
# kube-state-metrics — estado dos objetos K8s
#   (replicas desejadas vs. prontas, restarts, limites de recursos)
# ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: prometheus   # reutiliza o ClusterRole já criado
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.12.0
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: telemetry
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
    - name: telemetry
      port: 8081
      targetPort: 8081
