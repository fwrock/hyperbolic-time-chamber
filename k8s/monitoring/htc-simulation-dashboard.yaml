apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-htc-simulation
  namespace: monitoring
  labels:
    app: grafana
data:
  htc-simulation.json: |
    {
      "__inputs": [],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        }
      ],
      "annotations": {
        "list": []
      },
      "description": "HTC Simulation (GKE) \u2014 complete metrics: simulation, phases, TM, actors, journeys, persons, GPS, links, progressive loading, infra, JVM, process, containers",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Simulation Progress",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "palette-classic" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "title": "Current Tick",
          "targets": [{ "expr": "htc_simulation_current_tick", "legendFormat": "tick" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "green", "value": 0.9 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 3,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "title": "Progress",
          "targets": [{ "expr": "htc_simulation_progress_ratio", "legendFormat": "%" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "palette-classic" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 4,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "title": "Duration (ticks)",
          "targets": [{ "expr": "htc_simulation_configured_duration_ticks", "legendFormat": "ticks" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "palette-classic" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 5,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "title": "Active Actors",
          "targets": [{ "expr": "sum(htc_actors_active)", "legendFormat": "actors" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "palette-classic" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 6,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "title": "Journeys Completed",
          "targets": [{ "expr": "sum(htc_journeys_completed_total)", "legendFormat": "total" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 100 },
                  { "color": "red", "value": 1000 }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 7,
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          },
          "title": "Journey Failures",
          "targets": [{ "expr": "sum(htc_journey_failures_total)", "legendFormat": "total" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 8,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Tick Progression",
          "targets": [
            { "expr": "htc_simulation_current_tick", "legendFormat": "current tick" },
            { "expr": "htc_simulation_configured_duration_ticks", "legendFormat": "target ticks" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 9,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Tick Rate (ticks/s)",
          "targets": [{ "expr": "rate(htc_simulation_ticks_total[1m])", "legendFormat": "ticks/s" }],
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 10,
          "title": "Simulation Phases",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 11,
          "options": {
            "barRadius": 0.03,
            "groupWidth": 0.7,
            "legend": { "displayMode": "list", "placement": "bottom" },
            "orientation": "horizontal",
            "text": {},
            "tooltip": { "mode": "single" },
            "xTickLabelRotation": 0
          },
          "title": "Phase Duration (seconds)",
          "targets": [
            { "expr": "htc_phase_duration_seconds{phase=\"config_load\"}", "legendFormat": "config_load" },
            { "expr": "htc_phase_duration_seconds{phase=\"loading\"}", "legendFormat": "loading" },
            { "expr": "htc_phase_duration_seconds{phase=\"progressive_loading\"}", "legendFormat": "progressive_loading" },
            { "expr": "htc_phase_duration_seconds{phase=\"simulation\"}", "legendFormat": "simulation" }
          ],
          "type": "barchart"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 12,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Phase Duration over Time",
          "targets": [{ "expr": "htc_phase_duration_seconds{phase=~\".+\"}", "legendFormat": "{{phase}}" }],
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 13,
          "title": "Time Manager & Events",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "id": 14,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Tick Duration (p50/p95/p99) \u2014 seconds",
          "targets": [
            { "expr": "histogram_quantile(0.50, rate(htc_tick_duration_seconds_bucket[5m]))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, rate(htc_tick_duration_seconds_bucket[5m]))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, rate(htc_tick_duration_seconds_bucket[5m]))", "legendFormat": "p99" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "id": 15,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Events Processed Rate (by event_type)",
          "targets": [
            { "expr": "sum by (event_type) (rate(htc_events_processed_total[1m]))", "legendFormat": "{{event_type}}" },
            { "expr": "sum(rate(htc_events_processed_total[1m]))", "legendFormat": "total" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "id": 16,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Events per Tick + In-flight",
          "targets": [
            {
              "expr": "sum(rate(htc_events_processed_total[1m])) / clamp_min(rate(htc_simulation_ticks_total[1m]),0.001)",
              "legendFormat": "events/tick"
            },
            { "expr": "sum(htc_tm_running_events)", "legendFormat": "in-flight" },
            { "expr": "sum(htc_tm_scheduled_actors)", "legendFormat": "scheduled actors" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "id": 17,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Messages Sent Rate (by from_type)",
          "targets": [
            { "expr": "sum by (from_type) (rate(htc_messages_sent_total[1m]))", "legendFormat": "{{from_type}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 39 },
          "id": 18,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Events on Null State (rate) \u2014 actor bugs",
          "targets": [
            {
              "expr": "sum by (actor_type) (rate(htc_events_when_state_is_null_total[1m]))",
              "legendFormat": "{{actor_type}}"
            }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 39 },
          "id": 19,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Spontaneous Events After Completion (rate)",
          "targets": [
            {
              "expr": "sum by (actor_type) (rate(htc_spontaneous_event_after_completion_total[1m]))",
              "legendFormat": "{{actor_type}}"
            }
          ],
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 47 },
          "id": 20,
          "title": "Actor Lifecycle",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "id": 21,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Actors: Registered / Initialized / Destroyed (cumulative)",
          "targets": [
            { "expr": "sum by (actor_type) (htc_actors_registered_total)", "legendFormat": "registered {{actor_type}}" },
            { "expr": "sum by (actor_type) (htc_actors_initialized_total)", "legendFormat": "initialized {{actor_type}}" },
            { "expr": "sum by (actor_type) (htc_actors_destroyed_total)", "legendFormat": "destroyed {{actor_type}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
          "id": 22,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Active Actors by Type",
          "targets": [
            { "expr": "sum by (actor_type) (htc_actors_active)", "legendFormat": "{{actor_type}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 56 },
          "id": 23,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Dead Letters by Recipient Type (rate)",
          "targets": [
            {
              "expr": "sum by (recipient_type) (rate(htc_dead_letters_total[1m]))",
              "legendFormat": "{{recipient_type}}"
            }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 56 },
          "id": 24,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Dead Letters by Message Type (rate)",
          "targets": [
            {
              "expr": "sum by (message_type) (rate(htc_dead_letters_total[1m]))",
              "legendFormat": "{{message_type}}"
            }
          ],
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 64 },
          "id": 25,
          "title": "Journey Metrics \u2014 Vehicles",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 65 },
          "id": 26,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Journey Rate by Vehicle Type (started vs completed)",
          "targets": [
            { "expr": "sum by (vehicle_type) (rate(htc_journeys_started_total[1m]))", "legendFormat": "started {{vehicle_type}}" },
            { "expr": "sum by (vehicle_type) (rate(htc_journeys_completed_total[1m]))", "legendFormat": "completed {{vehicle_type}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 65 },
          "id": 27,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Journey Successes vs Failures (rate)",
          "targets": [
            { "expr": "sum by (vehicle_type) (rate(htc_journey_successes_total[1m]))", "legendFormat": "success {{vehicle_type}}" },
            { "expr": "sum by (vehicle_type, reason) (rate(htc_journey_failures_total[1m]))", "legendFormat": "fail {{vehicle_type}}/{{reason}}" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 73 },
          "id": 28,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Journey Outcome Detail (htc_movable_complete_journey_reason_total)",
          "targets": [
            {
              "expr": "sum by (mode, reason, reached_destination) (rate(htc_movable_complete_journey_reason_total[1m]))",
              "legendFormat": "{{mode}} / {{reason}} / reached={{reached_destination}}"
            }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 73 },
          "id": 29,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Journey Duration (p50/p95) \u2014 ticks",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le,vehicle_type) (rate(htc_journey_duration_ticks_bucket[5m])))",
              "legendFormat": "p50 {{vehicle_type}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le,vehicle_type) (rate(htc_journey_duration_ticks_bucket[5m])))",
              "legendFormat": "p95 {{vehicle_type}}"
            }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "lengthm",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "stacking": { "mode": "none" } }
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 81 },
          "id": 30,
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "title": "Journey Distance (p50/p95) \u2014 meters",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le,vehicle_type) (rate(htc_journey_distance_meters_bucket[5m])))",
              "legendFormat": "p50 {{vehicle_type}}"
            },
