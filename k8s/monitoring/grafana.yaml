# ─────────────────────────────────────────────────────────────────
# Grafana — dashboards pré-configurados para experimentos HTC
#   • Memória distribuída (JVM heap + RSS por pod e por nó)
#   • CPU (por pod, por nó GKE)
#   • Rede (bytes/s por nó, throughput Kafka)
#   • Tempo de execução (ticks/s, latência de eventos, GC pauses)
# ─────────────────────────────────────────────────────────────────

# ── Datasource automático apontando para o Prometheus interno ─────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: "prometheus"
        url: http://prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        editable: false
---
# ── Dashboard: HTC Performance Experiments ────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HTC
        orgId: 1
        folder: "HTC Simulation"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-htc
  namespace: monitoring
data:
  htc-performance.json: |
    {
      "title": "HTC — Experimentos de Desempenho",
      "uid": "htc-perf",
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "title": "Memória JVM Heap (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "jvm_memory_bytes_used{area=\"heap\", job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} used"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "jvm_memory_bytes_max{area=\"heap\", job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} max"
          }],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 2, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "title": "CPU Usage (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(process_cpu_seconds_total{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "percentunit"}}
        },
        {
          "id": 3, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "title": "Memória por Container (cAdvisor)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"default\", pod=~\"htc-simulator.*\", container!=\"\"})",
            "legendFormat": "{{pod}} working set"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (container_memory_rss{namespace=\"default\", pod=~\"htc-simulator.*\", container!=\"\"})",
            "legendFormat": "{{pod}} rss"
          }],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 4, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "title": "Rede — Bytes/s por Pod (RX + TX)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} rx"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} tx"
          }],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {
          "id": 13, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 48},
          "title": "Rede — Pacotes/s por Pod",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_receive_packets_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} rx pkts"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_transmit_packets_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} tx pkts"
          }],
          "fieldConfig": {"defaults": {"unit": "pps"}}
        },
        {
          "id": 14, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 48},
          "title": "Rede — Erros e Drops por Pod",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_receive_errors_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} rx errors"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_transmit_errors_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} tx errors"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_receive_packets_dropped_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} rx drops"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_network_transmit_packets_dropped_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "{{pod}} tx drops"
          }]
        },
        {
          "id": 15, "gridPos": {"h": 8, "w": 24, "x": 0, "y": 56},
          "title": "Rede — Throughput Total do Cluster (todos os pods HTC)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "cluster rx total"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"default\", pod=~\"htc-simulator.*\"}[1m]))",
            "legendFormat": "cluster tx total"
          }],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {
          "id": 5, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "title": "JVM GC Pause Time (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(jvm_gc_collection_seconds_sum{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}} {{gc}}"
          }],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 6, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "title": "Pekko — Dead Letters (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_dead_letters_total{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }]
        },
        {
          "id": 7, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "title": "Kafka Producer — Taxa de Mensagens",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(htc_kafka_messages_sent_total{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}} {{topic}}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 8, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "title": "CPU por Container (cAdvisor)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"default\", pod=~\"htc-simulator.*\", container!=\"\"}[1m]))",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"axisLabel": "cores"}}}
        },
        {
          "id": 9, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "title": "Threads JVM Ativas (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "jvm_threads_current{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} total"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "jvm_threads_daemon{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} daemon"
          }]
        },
        {
          "id": 10, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "title": "Simulation Ticks (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(htc_simulation_ticks_total{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}} ticks/s"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 11, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40},
          "title": "Atores Ativos (por tipo)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_actors_active{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} {{actor_type}}"
          }]
        },
        {
          "id": 12, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40},
          "title": "Tick Duration (por pod)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(htc_tick_duration_seconds_sum{job=\"htc-simulation\"}[1m]) / rate(htc_tick_duration_seconds_count{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}} avg"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "histogram_quantile(0.99, rate(htc_tick_duration_seconds_bucket{job=\"htc-simulation\"}[1m]))",
            "legendFormat": "{{pod}} p99"
          }],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 16, "gridPos": {"h": 6, "w": 6, "x": 0, "y": 64},
          "title": "Tick Atual da Simulação",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_simulation_current_tick{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "none", "thresholds": {"steps": [{"color": "blue", "value": null}]}}}
        },
        {
          "id": 17, "gridPos": {"h": 6, "w": 6, "x": 6, "y": 64},
          "title": "Progresso da Simulação",
          "type": "gauge",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_simulation_progress_ratio{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "orange", "value": 0.25}, {"color": "yellow", "value": 0.5}, {"color": "green", "value": 0.75}]}}}
        },
        {
          "id": 18, "gridPos": {"h": 6, "w": 12, "x": 12, "y": 64},
          "title": "Atores Registrados (total por tipo)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_actors_registered_total{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} {{actor_type}}"
          }]
        },
        {
          "id": 19, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 70},
          "title": "Eventos Processados/s (por tipo)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(htc_events_processed_total{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}} {{event_type}}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 20, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 70},
          "title": "Time Manager — Estado Interno",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_tm_scheduled_actors{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} scheduled"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_tm_running_events{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} running"
          }]
        },
        {
          "id": 21, "gridPos": {"h": 6, "w": 6, "x": 0, "y": 78},
          "title": "TM Aguardando Progressive",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_tm_waiting_for_progressive{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "Running", "color": "green"}, "1": {"text": "Waiting", "color": "orange"}}}]}}
        },
        {
          "id": 22, "gridPos": {"h": 6, "w": 6, "x": 6, "y": 78},
          "title": "Progressive — Loaded Up To Tick",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_progressive_loaded_up_to_tick{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "none", "thresholds": {"steps": [{"color": "blue", "value": null}]}}}
        },
        {
          "id": 23, "gridPos": {"h": 6, "w": 6, "x": 12, "y": 78},
          "title": "Progressive — Atores Criados",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_progressive_actors_created_total{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "none", "thresholds": {"steps": [{"color": "purple", "value": null}]}}}
        },
        {
          "id": 24, "gridPos": {"h": 6, "w": 6, "x": 18, "y": 78},
          "title": "Progressive — Janelas Carregadas",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_progressive_windows_loaded_total{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "none", "thresholds": {"steps": [{"color": "purple", "value": null}]}}}
        },
        {
          "id": 25, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 84},
          "title": "Viagens Completadas (por tipo de veículo)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "htc_journeys_completed_total{job=\"htc-simulation\"}",
            "legendFormat": "{{pod}} {{vehicle_type}}"
          }]
        },
        {
          "id": 26, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 84},
          "title": "Viagens Iniciadas vs Completadas (taxa/s)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(htc_journeys_started_total{job=\"htc-simulation\"}[1m]))",
            "legendFormat": "started/s"
          }, {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "sum(rate(htc_journeys_completed_total{job=\"htc-simulation\"}[1m]))",
            "legendFormat": "completed/s"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 27, "gridPos": {"h": 8, "w": 24, "x": 0, "y": 92},
          "title": "Eventos por Tipo (taxa/s)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "expr": "rate(htc_events_processed_total{job=\"htc-simulation\"}[1m])",
            "legendFormat": "{{pod}} {{event_type}}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        }
      ],
      "schemaVersion": 39,
      "version": 4
    }
---
# ── Deployment Grafana ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
              name: web
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "htc-admin"              # mude em produção
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/htc-performance.json
            # ── Image Renderer (sidecar) ──
            - name: GF_RENDERING_SERVER_URL
              value: "http://localhost:8081/render"
            - name: GF_RENDERING_CALLBACK_URL
              value: "http://localhost:3000/"
            - name: GF_LOG_FILTERS
              value: "rendering:debug"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-data
              mountPath: /var/lib/grafana/dashboards
            - name: storage
              mountPath: /var/lib/grafana
        # ── Grafana Image Renderer sidecar ─────────────────────────
        - name: renderer
          image: grafana/grafana-image-renderer:3.10.5
          ports:
            - containerPort: 8081
              name: renderer
          env:
            - name: ENABLE_METRICS
              value: "true"
            - name: HTTP_PORT
              value: "8081"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboards-data
          configMap:
            name: grafana-dashboard-htc
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  type: LoadBalancer             # expõe externamente para acesso ao dashboard
  ports:
    - name: web
      port: 80
      targetPort: 3000
