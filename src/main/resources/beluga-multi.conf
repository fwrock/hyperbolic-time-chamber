include "application"

pekko {
  # === DISPATCHER STRATEGY — Beluga multi-nó (8 containers × 112 vCPUs) ===
  #
  # Máquina: 112 vCPUs compartilhados entre 8 containers Docker (sem cpu-limit).
  # Alocação nominal: 112 / 8 = 14 vCPUs / container.
  # Cada container pode fazer burst acima dos 14 se os vizinhos estiverem ociosos.
  #
  # 1. default-dispatcher  — atores CPU-bound (Car, Link, Node, …) → Platform Threads (FJP)
  #    min=8:   garante pool mínimo mesmo sob contenção pesada entre containers.
  #    factor=1.0: 1 thread por vCPU nominal (14 vCPUs → 14 threads base).
  #    max=28:  permite burst até 2 × vCPU quando siblings estão ociosos.
  #    throughput=20: próximo do padrão da VM; adequado para ticks curtos com
  #                   muitos atores por container.
  #
  # 2. routing-dispatcher  — cálculos pesados de roteamento (ALT A* / CH)
  #    Isolado do default para que calcRouteCompact (PLR + runtime) não afogue
  #    os atores de simulação. 8 containers × 7 threads = 56 threads de rota no cluster.
  #
  # 3. cluster-dispatcher  — heartbeats / gossip / SBR / remoting
  #    Isolado para evitar falsos UNREACHABLE sob carga alta de simulação.
  #    Containers na mesma máquina → latência de rede < 1 ms, então 2–4 threads bastam.
  #
  # 4. default-blocking-io-dispatcher — usado pelas Futures de calculateRoutes no PLR.
  #    Durante a fase PLR, cada BusStation dispara N segmentos em paralelo neste pool.
  #    fixed-pool-size=56 (4 × 14 vCPUs) permite alta paralelização do roteamento
  #    sem interferir nos dispatchers de simulação (PLR ocorre antes dos ticks).
  #
  # 5. io-dispatcher — herdado de application.conf (virtual-thread-executor, sem override).

  actor.default-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min    = 8
      parallelism-factor = 1.0   # 14 vCPUs × 1.0 = 14 threads nominais
      parallelism-max    = 28    # burst até 2× quando siblings ociosos
      virtualize         = off   # platform threads para work CPU-bound
    }
    throughput = 20
  }

  # Dispatcher dedicado para cálculos de rota (A*/ALT/CH).
  # Usado via: context.system.dispatchers.lookup("pekko.routing-dispatcher")
  # ou Future { calcRouteCompact(...) }(context.system.dispatchers.lookup(...))
  routing-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min    = 4
      parallelism-factor = 0.5   # 14 × 0.5 = 7 threads
      parallelism-max    = 14
    }
    throughput = 1
  }

  # Dispatcher isolado para o subsistema Cluster (heartbeats, gossip, SBR).
  # Containers na mesma máquina → latência mínima; pool pequeno é suficiente.
  cluster-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min = 2
      parallelism-max = 4
    }
    throughput = 1
  }

  # Pool de threads bloqueantes usado pelas Futures de calculateRoutes (fase PLR).
  # BusStations disparam todos os segmentos de rota em paralelo aqui.
  # fixed-pool-size=56 = 4 × 14 vCPUs; generoso pois o PLR ocorre antes da simulação.
  actor.default-blocking-io-dispatcher {
    type       = "Dispatcher"
    executor   = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 56
    }
  }
}

# Cluster usa dispatcher isolado + failure detector calibrado para 8 containers
# na mesma máquina. Sob carga alta (GC pauses, CPU contention), heartbeats podem
# atrasar; threshold=20 e pause=60s evitam falsos UNREACHABLE sem ser excessivos.
pekko.cluster {
  use-dispatcher = "pekko.cluster-dispatcher"
  failure-detector {
    acceptable-heartbeat-pause = 60s
    acceptable-heartbeat-pause = ${?HTC_HEARTBEAT_PAUSE}
    threshold                  = 20.0
    expected-response-after    = 10s
    heartbeat-interval         = 3s
  }
}
