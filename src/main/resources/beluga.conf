include "application"

pekko {
  # === DISPATCHER STRATEGY — Beluga single-nó (112 vCPUs) ===
  #
  # Usado por docker-compose-beluga-single.yml (1 container usando a máquina inteira).
  # Para o modo multi-nó (docker-compose-beluga.yml, 8 containers) → beluga-multi.conf.
  #
  # 1. default-dispatcher  — atores CPU-bound (Car, Link, Node, …) → Platform Threads (FJP)
  #    min=56: utilização mínima garantida mesmo se FJP encolher.
  #    factor=2.0: 112 × 2 = 224 → capped em max=112 (1 thread/vCPU).
  #    throughput=100: rajada de eventos por tick; favorece cache-locality com 112 cores.
  #
  # 2. routing-dispatcher  — cálculos pesados de roteamento (ALT A* / CH)
  #    Isolado para que calcRouteCompact (PLR + runtime) não afogue a simulação.
  #    max=56: metade dos cores, sobra metade para o default-dispatcher.
  #
  # 3. cluster-dispatcher  — heartbeats / gossip (mínimo — single-node sem cluster real)
  #
  # 4. default-blocking-io-dispatcher — Futures de calculateRoutes na fase PLR.
  #    Cada BusStation dispara todos os segmentos em paralelo neste pool.
  #    fixed-pool-size=224: 2 × 112 vCPUs; PLR ocorre antes dos ticks, sem contenção.
  #
  # 5. io-dispatcher — herdado de application.conf (virtual-thread-executor).

  actor.default-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min    = 56
      parallelism-factor = 2.0   # 112 vCPUs × 2 → capped em max=112
      parallelism-max    = 112
      virtualize         = off
    }
    throughput = 100
  }

  routing-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min    = 16
      parallelism-factor = 0.5   # 112 × 0.5 = 56 threads
      parallelism-max    = 56
    }
    throughput = 1
  }

  cluster-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min = 2
      parallelism-max = 4
    }
    throughput = 1
  }

  actor.default-blocking-io-dispatcher {
    type       = "Dispatcher"
    executor   = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 224   # 2 × 112 vCPUs; generoso para PLR paralelo
    }
  }
}

pekko.cluster {
  use-dispatcher = "pekko.cluster-dispatcher"
  failure-detector {
    acceptable-heartbeat-pause = 30s
    acceptable-heartbeat-pause = ${?HTC_HEARTBEAT_PAUSE}
    threshold                  = 12.0
    expected-response-after    = 10s
    heartbeat-interval         = 3s
  }
}
