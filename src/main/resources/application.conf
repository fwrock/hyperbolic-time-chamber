    pekko {
        loglevel = "INFO"
        stdout-loglevel = "INFO"

        # Default dispatcher: CPU-bound simulation actors (Car, Link, Node, etc.)
        # Generic defaults — override in vm.conf / beluga.conf / kubernetes.conf for specific machines.
        # Fits local dev machines (8-16 threads) and multi-node beluga (112 cores / 8 nodes ≈ 14/node).
        actor.default-dispatcher {
            type = Dispatcher
            executor = "fork-join-executor"
            fork-join-executor {
                parallelism-min = 4
                parallelism-factor = 2.0
                parallelism-max = 16
            }
            throughput = 20
        }

        # io-dispatcher: virtual threads (Project Loom, Java 21+)
        # Ideal para I/O-bound (Kafka, Redis, serialização): cada tarefa ganha
        # sua própria VT sem bloquear threads de plataforma do FJP principal.
        actor.io-dispatcher {
            executor = "virtual-thread-executor"
            throughput = 10
        }
        loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
        logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
        log-dead-letters-during-shutdown = off
        log-dead-letters = 5

        actor {
            provider = cluster

            debug {
                receive = off
                lifecycle = off
                unhandled = off
                autoreceive = off
            }
            allow-java-serialization = off
            serializers {
                proto = "org.apache.pekko.remote.serialization.ProtobufSerializer"
                envelope = "org.interscity.htc.core.serializer.EntityEnvelopeSerializer"
                actor-interaction = "org.interscity.htc.core.serializer.ActorInteractionSerializer"
                jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
                jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
            }
            serialization-bindings {
                "org.interscity.htc.core.entity.event.EntityEnvelopeEvent" = envelope
                "scalapb.GeneratedMessage" = proto
                "org.interscity.htc.core.entity.event.ActorInteractionEvent" = actor-interaction
                "org.interscity.htc.core.entity.event.control.execution.TimeManagerRegisterEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.execution.LocalTimeWindowReport" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.execution.UpdateGlobalTimeWindow" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.CreateActorsEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.FinishCreationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.FinishLoadDataEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.LoadDataCreatorRegisterEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.InitializeEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.LoadDataEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.data.BaseEventData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.MicroEnterLinkData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.MicroLeaveLinkData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.MicroUpdateData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.MicroStepData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.LaneChangeData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.FollowingUpdateData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.IntersectionMicroData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.MicroTicksCompleted" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.GlobalTickEvent" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.person.StartTripData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.person.TripCompletedData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.person.ParkVehicleData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.person.PersonScheduleCompleteData" = jackson-cbor
                "org.interscity.htc.model.hybrid.entity.event.data.person.ModeChoiceDecision" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.report.RegisterReportersEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.report.ReportEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.LoadDataSourceEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.SimulationConfigLoadedEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.SimulationConfigLoadFailedEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.TickIndexBuiltEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.TickRangeLoadedEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.LoadActorsForTickRange" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.LoadNextEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.ProcessBatchesEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.ProcessNextCreateChunk" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.SendBatchToCreators" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.ProcessNextFileChunk" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.CloseAndFinish" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.StartLoadingFile" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.ProcessNextChunk" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.RetryPendingAcks" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.NeedsPostLoadRegistrationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.PostLoadRegistrationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.PostLoadRegistrationAckEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.PostLoadRegistrationDoneEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.load.TriggerPostLoadRegistrationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.SpontaneousEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.FinishEvent" = jackson-cbor
                "org.interscity.htc.core.actor.ActorSerializable" = jackson-cbor
                "org.interscity.htc.core.entity.actor.properties.Properties" = jackson-cbor
                "org.interscity.htc.core.entity.actor.properties.CreatorProperties" = jackson-cbor
                "org.interscity.htc.core.entity.state.BaseState" = jackson-cbor
                "java.time.LocalDateTime" = jackson-cbor

                # Migration Window Protocol (Phase 5)
                "org.interscity.htc.core.entity.event.control.migration.MigrationWindowOpenEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.MigrationWindowCloseEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.MigrationWindowAckEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.MigrationRestoredAckEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.RegisterMigrationBatchEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.SaveMigrationSnapshotEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.QueryMigrationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.migration.NoPendingMigrationEvent" = jackson-cbor

                # Load Balance Events
                "org.interscity.htc.core.entity.event.control.loadbalance.UpdateLoadMetricsEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.TriggerRebalanceEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.CollectAndFeedMetricsEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.TriggerWindowOpenEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.RegisterSpatialEntityEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.RegisterSpatialEntitiesBatchEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.BatchShardAssignmentResponse" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.LoadBalanceReadyEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.RequestMigrationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.MigrationCompleteEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.PrepareForMigrationEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.MigrationStartEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.RequestMigrationPauseEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.MigrationSafeEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.loadbalance.MigrationCompleteNotifyEvent" = jackson-cbor

                # Warm-Up Protocol
                "org.interscity.htc.core.entity.event.control.warmup.StartWarmUpWorkersEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.warmup.WarmUpWorkerDoneEvent" = jackson-cbor
                "org.interscity.htc.core.entity.event.control.warmup.WarmUpAllDoneEvent" = jackson-cbor
            }
        }

        persistence {
            journal {
                plugin = "pekko.persistence.journal.inmem"
                inmem {
                    class = "org.apache.pekko.persistence.journal.inmem.InmemJournal"
                }
            }
            snapshot-store {
                plugin = ""
            }
        }

        remote {
            artery {
                canonical {
                    hostname = ${clustering.ip}
                    port = ${clustering.port}
                }
                advanced {
                    maximum-frame-size = 2 MiB
                    maximum-large-frame-size = 4 MiB
                    outbound-message-queue-size = 16384
                }
            }
        }

        coordinated-shutdown {
            phases {
                cluster-exiting {
                    timeout = 300 s
                }
                cluster-leave {
                    timeout = 300 s
                }
            }
        }

        cluster {
            downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

            split-brain-resolver {

                stable-after = 60s
                stable-after = ${?HTC_SBR_STABLE_AFTER}

                active-strategy = keep-majority

                down-all-when-unstable = off
            }

            seed-nodes = [
                "pekko://"${clustering.cluster.name}"@"${clustering.seed-ip}":"${clustering.seed-port}
            ]

            failure-detector {
                acceptable-heartbeat-pause = 120 s
                acceptable-heartbeat-pause = ${?HTC_HEARTBEAT_PAUSE}
                threshold = 30.0
                expected-response-after = 20 s
                heartbeat-interval = 5 s
            }

            sharding {
                passivation {
                    strategy = "default-idle-strategy"
                    default-idle-strategy {
                    idle-entity.timeout = 1200.hours
                    }
                }

                least-shard-allocation-strategy {
                    # KEEP HIGH: inmem persistence means rebalanced shards lose state.
                    # With min-nr-of-members, all pods join BEFORE initial allocation,
                    # so shards are distributed evenly from the start.
                    # Rebalancing should only happen if a pod permanently dies.
                    rebalance-threshold = 100000
                }

                # Default Pekko buffer is 1000 — far too small when the progressive
                # loader streams ~1500+ CreateActor messages per tick window.
                # Messages are queued here while ShardCoordinator allocates shards;
                # overflow causes silent actor-creation drops and stalled ticks.
                # Set large enough to absorb one full wave of progressive-load bursts.
                buffer-size = 100000
                buffer-size = ${?HTC_SHARD_BUFFER_SIZE}

                verbose-debug-logging = off
                waiting-for-state-timeout = 1 minute
            }
        }

        cluster.bootstrap {
            contact-point-discovery {
                service-name  = "pekko-node"
                port-name     = "management"
                protocol      = "http"
            }
        }

        management {
            http {
                hostname = "0.0.0.0"
                port = ${clustering.management-http-port}
            }
        }

        discovery {
            method = config
        }
    }

    clustering {
        ip = "127.0.0.1"
        ip = ${?CLUSTER_IP}
        port = 1600
        port = ${?CLUSTER_PORT}
        seed-ip = "127.0.0.1"
        seed-ip = ${?CLUSTER_IP}
        seed-ip = ${?SEED_PORT_1600_TCP_ADDR}
        seed-port = 1600
        seed-port = ${?SEED_PORT_1600_TCP_PORT}
        management-http-port = 8558
        management-http-port = ${?MANAGEMENT_HTTP_PORT}
        cluster.name = hyperbolic-time-chamber
    }

    htc {
            # ── REST Configuration API (optional) ──────────────────────────────────
            # Disabled by default. The simulator continues to work exactly as before
            # via HTC_SIMULATION_CONFIG_FILE / application.conf when this is false.
            api {
                enabled = false
                enabled = ${?HTC_API_ENABLED}
                port = 8080
                port = ${?HTC_API_PORT}
                # Allowed CORS origins. Use * for all, or comma-separated list e.g. http://localhost:3000
                cors-origins = "*"
                cors-origins = ${?HTC_API_CORS_ORIGINS}

                # Directory scanned for simulation scenarios (sub-dirs with simulation.json).
                # Override with HTC_SCENARIOS_DIR env var.
                scenarios-dir = "/app/hyperbolic-time-chamber/simulations/input"
                scenarios-dir = ${?HTC_SCENARIOS_DIR}
            }

            simulation {
                config-file = ${?HTC_SIMULATION_CONFIG_FILE}
                snapshot-interval = 10000000
                # Human-readable ID for output files/reports. Defaults to simulation name.
                id = ${?HTC_SIMULATION_ID}
            }
            mobility {
                # Path to the city map JSON used by CityMapUtil (Node/Link graph).
                # Required for any mobility simulation (Car, Bus, Bicycle, Motorcycle, etc.).
                city-map-file = "city_map.json"
                city-map-file = ${?HTC_MOBILITY_CITY_MAP_FILE}

                # Number of landmarks for the ALT (A* + Landmarks + Triangle inequality) routing index.
                # Higher values improve heuristic quality but increase preprocessing time and memory.
                # Typical range: 8–32. Default: 16.
                landmark-count = 16
                landmark-count = ${?HTC_MOBILITY_LANDMARK_COUNT}
            }
            warmup {
                # Comma-separated list of Scala object methods to invoke before simulation ticks start.
                # Format: "fully.qualified.ObjectName#methodName" (methodName defaults to "warmUp").
                # Example: "org.interscity.htc.model.hybrid.util.CityMapUtil#warmUp"
                # Runs on the io-dispatcher — safe to block. StartSimulationTimeEvent is
                # only sent after ALL targets complete.
                targets = ""
                targets = ${?HTC_WARMUP_TARGETS}
                # Maximum WarmUpWorker routees per cluster node (1 = one warm-up per JVM).
                max-workers-per-node = 1
                max-workers-per-node = ${?HTC_WARMUP_MAX_WORKERS_PER_NODE}
            }
            post-load-registration {
                # Seconds between retry attempts for actors that haven't ACKed yet.
                retry-interval-seconds = 10
                retry-interval-seconds = ${?HTC_PLR_RETRY_INTERVAL_SECONDS}
                # Maximum number of retries before giving up and proceeding.
                # Default 120 = 1200 s (20 min) — enough for large scenarios with many BusStations.
                max-retries = 120
                max-retries = ${?HTC_PLR_MAX_RETRIES}
            }
            person {
                # When true, activities with endTime > simulation duration are removed from the
                # Person's dailySchedule at actor startup. Enable this when the input scenario
                # contains multi-day schedules (e.g. MATSim PLANS with endTimes beyond 86400s)
                # but the simulation is configured for a single day. Removed activities are
                # simply not executed; the person completes its schedule with the remaining ones.
                truncate-schedule-beyond-duration = false
                truncate-schedule-beyond-duration = ${?HTC_PERSON_TRUNCATE_SCHEDULE}
            }
            time-manager {
                # Total LocalTM routees across the cluster.
                # With max-instances-per-node=4 and 16 pods: 16×4 = 64 LocalTMs.
                # Each LocalTM has a sequential mailbox — more TMs means the load
                # of FinishEvent/ScheduleEvent messages is spread across more mailboxes.
                # With 5M actors / 64 TMs ≈ 78K actors per TM (vs 312K with 1/node).
                total-instances = 128
                total-instances = ${?HTC_TIME_MANAGER_INSTANCES}

                # Multiple LocalTMs per pod to avoid mailbox bottleneck.
                # Each actor sends FinishEvent + ScheduleEvent back to its TM every tick.
                # With 1 TM/node and 312K actors/pod, a single mailbox processes 600K+
                # messages per tick sequentially — severe contention.
                # 4 TMs/node cuts this to ~150K messages/mailbox.
                # RoundRobin registration distributes actors evenly across TMs.
                max-instances-per-node = 4
                max-instances-per-node = ${?HTC_TIME_MANAGER_PER_NODE}

                batch-size = 100000

                lookahead-window = 1
                lookahead-window = ${?HTC_TIME_MANAGER_LOOKAHEAD}

                metrics-log-interval = 500
                metrics-log-interval = ${?HTC_TIME_MANAGER_METRICS_INTERVAL}

                window-size = 1
                window-size = ${?HTC_TIME_MANAGER_WINDOW_SIZE}

                verbose-logging = true
                verbose-logging = ${?HTC_TIME_MANAGER_VERBOSE_LOGGING}

                snapshot-interval = 10000000
                snapshot-interval = ${?HTC_TIME_MANAGER_SNAPSHOT_INTERVAL}

                actor-timeout-ms = 180000
                actor-timeout-ms = ${?HTC_TIME_MANAGER_ACTOR_TIMEOUT_MS}

                sync-timeout-ms = 30000
                sync-timeout-ms = ${?HTC_TIME_MANAGER_SYNC_TIMEOUT_MS}

                stale-event-max-age-ms = 30000
                stale-event-max-age-ms = ${?HTC_TIME_MANAGER_STALE_EVENT_MAX_AGE_MS}

                health-check-interval-seconds = 120
                health-check-interval-seconds = ${?HTC_TIME_MANAGER_HEALTH_CHECK_INTERVAL}

                # Watchdog: detects and recovers stuck running events.
                # After stale-warning: logs warning + retries SpontaneousEvent once.
                # After force-clear: drops stuck actors and advances tick.
                watchdog-interval-seconds = 30
                watchdog-interval-seconds = ${?HTC_WATCHDOG_INTERVAL_SECONDS}
                stale-warning-seconds = 60
                stale-warning-seconds = ${?HTC_WATCHDOG_STALE_WARNING_SECONDS}
                force-clear-seconds = 120
                force-clear-seconds = ${?HTC_WATCHDOG_FORCE_CLEAR_SECONDS}
            }


        report-manager {
            enabled = true
            enabled = ${?HTC_REPORT_ENABLED}

            default-strategy = "parquet"
            enabled-strategies = ["parquet", "clickhouse"]

            csv {
                prefix = "htc_simulation_"
                directory = "/app/hyperbolic-time-chamber/output/reports/csv"
                number-of-instances = 2
                number-of-instances-per-node = 1
                batch-size = 1000
            }

            json {
                prefix = "htc_simulation_"
                directory = "/app/hyperbolic-time-chamber/output/reports/json"
                # Reduced from 256: each reporter holds an open file handle and
                # flushes independently. 16 per node × 16 pods = 256 total,
                # enough to absorb report bursts without creating 256 files per pod.
                number-of-instances = 64
                number-of-instances = ${?HTC_REPORT_JSON_INSTANCES}
                number-of-instances-per-node = 16
                number-of-instances-per-node = ${?HTC_REPORT_JSON_PER_NODE}
                # Increased from 100: reduces flush frequency on GCS Fuse mounts.
                # Each flush opens/closes a FileWriter — expensive on network FS.
                batch-size = 500
                batch-size = ${?HTC_REPORT_JSON_BATCH_SIZE}
            }

            # ── ClickHouse time-series reporter ───────────────────────────────────
            # Disabled by default. Add "clickhouse" to enabled-strategies to enable:
            #   enabled-strategies = ["json", "clickhouse"]
            # Requires a running ClickHouse instance (see docker-compose.yml).
            # The simulation starts and runs normally if ClickHouse is unreachable —
            # events are simply dropped with a warning log.
            clickhouse {
                host     = "localhost"
                host     = ${?HTC_CLICKHOUSE_HOST}
                port     = 8123
                port     = ${?HTC_CLICKHOUSE_PORT}
                database = "htc"
                database = ${?HTC_CLICKHOUSE_DATABASE}
                username = "default"
                username = ${?HTC_CLICKHOUSE_USER}
                password = ""
                password = ${?HTC_CLICKHOUSE_PASSWORD}

                # Pool size: small — each actor does blocking HTTP, runs on io-dispatcher.
                # 2 per node is enough for bulk inserts; scale up for higher throughput.
                number-of-instances          = 4
                number-of-instances          = ${?HTC_REPORT_CLICKHOUSE_INSTANCES}
                number-of-instances-per-node = 2
                number-of-instances-per-node = ${?HTC_REPORT_CLICKHOUSE_PER_NODE}

                # Flush every 1 000 rows. Smaller = inserts appear sooner in ClickHouse.
                batch-size = 1000
                batch-size = ${?HTC_REPORT_CLICKHOUSE_BATCH_SIZE}
            }

            # ── Parquet columnar reporter ──────────────────────────────────────────
            # Writes events to Apache Parquet files (one file per actor instance).
            # Files can be queried directly with DuckDB, Spark, Trino, AWS Athena, etc.
            #
            # Enable by adding "parquet" to enabled-strategies:
            #   enabled-strategies = ["parquet"]
            #
            # Compression options:
            #   snappy       — fast, moderate ratio (default; best for GCS/HDFS)
            #   zstd         — better ratio, higher CPU; good for long-term storage
            #   gzip         — maximum ratio, slowest
            #   uncompressed — no compression, maximum write throughput
            #
            # Each actor instance writes its own file; number-of-instances controls
            # parallelism (and the number of output files per simulation run).
            parquet {
                prefix    = "htc_simulation_"
                directory = "/app/hyperbolic-time-chamber/output/reports/parquet"
                directory = ${?HTC_REPORT_PARQUET_DIRECTORY}

                # Compression codec applied to all column chunks.
                compression = "snappy"
                compression = ${?HTC_REPORT_PARQUET_COMPRESSION}

                # Number of Parquet writer actors across the entire cluster.
                number-of-instances          = 32
                number-of-instances          = ${?HTC_REPORT_PARQUET_INSTANCES}
                number-of-instances-per-node = 8
                number-of-instances-per-node = ${?HTC_REPORT_PARQUET_PER_NODE}

                # Events buffered per actor before writing a batch of Parquet rows.
                # Larger = fewer writes, more heap per actor.
                # 2000 chosen as a memory-conscious default: with 32 writer instances and
                # ~500 B/event, this caps the application-level buffer at ~32 MB cluster-wide
                # (vs ~160 MB at the previous 10000). Parquet's own row-group buffer
                # (row-group-size-mb, 16 MB default) still aggregates writes efficiently
                # before hitting disk, so throughput is unaffected.
                batch-size = 2000
                batch-size = ${?HTC_REPORT_PARQUET_BATCH_SIZE}

                # Row-group size in MB. Parquet buffers this much UNCOMPRESSED data per actor
                # in memory before flushing a column chunk to disk. This is independent of
                # batch-size (which controls the actor-level buffer before calling w.write()).
                # Smaller = data visible on disk sooner, less heap per actor.
                # Larger = better compression ratio (more data for the codec).
                # 16 MB default: good for all simulation sizes. Files appear on disk as data
                # flows rather than only at shutdown.
                # Raise to 128 MB for Spark/Athena bulk export workloads.
                row-group-size-mb = 16
                row-group-size-mb = ${?HTC_REPORT_PARQUET_ROW_GROUP_SIZE_MB}

                # ZSTD compression level [1-22]. Only applied when compression = "zstd".
                # Level 6: ~15% smaller than default (3), ~1.3× more CPU. Good sweet-spot.
                # Level 9: ~20% smaller than level 3, ~2× more CPU.
                zstd-level = 6
                zstd-level = ${?HTC_REPORT_PARQUET_ZSTD_LEVEL}
            }
        }

        load-balance-manager {
            enabled = false
            enabled = ${?HTC_LOAD_BALANCE_ENABLED}

            # Strategy: "hybrid", "default", "disabled"
            strategy = "hybrid"
            strategy = ${?HTC_LOAD_BALANCE_STRATEGY}

            # World spatial bounds (lat/lon or x/y)
            world-bounds {
                min-x = -180.0
                min-x = ${?HTC_LB_WORLD_MIN_X}
                min-y = -90.0
                min-y = ${?HTC_LB_WORLD_MIN_Y}
                max-x = 180.0
                max-x = ${?HTC_LB_WORLD_MAX_X}
                max-y = 90.0
                max-y = ${?HTC_LB_WORLD_MAX_Y}
            }

            # Quadtree spatial partitioning (Level 1)
            quadtree {
                max-depth = 8
                max-depth = ${?HTC_LB_QUADTREE_MAX_DEPTH}
                min-actors-per-shard = 100
                min-actors-per-shard = ${?HTC_LB_QUADTREE_MIN_ACTORS}
                max-actors-per-shard = 10000
                max-actors-per-shard = ${?HTC_LB_QUADTREE_MAX_ACTORS}
                enable-two-to-one-balance = true
                enable-two-to-one-balance = ${?HTC_LB_QUADTREE_21_BALANCE}
            }

            # kd-tree dynamic load balancing (Level 2)
            kdtree {
                rebalance-interval-seconds = 30.0
                rebalance-interval-seconds = ${?HTC_LB_KDTREE_REBALANCE_INTERVAL}
                load-threshold = 0.85
                load-threshold = ${?HTC_LB_KDTREE_LOAD_THRESHOLD}
            }

            # Geographic affinity weight for GeoAffinityStrategy target scoring.
            # α=0.0: pure load balancing; α=1.0: pure geographic affinity.
            # Hybrid uses this for the GeoAffinity sub-strategy component.
            geo-affinity {
                weight = 0.4
                weight = ${?HTC_LB_GEO_AFFINITY_WEIGHT}
            }

            # kd-tree rebalance interval (seconds)
            rebalance-interval-seconds = 30.0
            rebalance-interval-seconds = ${?HTC_LB_KDTREE_REBALANCE_INTERVAL}

            # Predictive balancing
            prediction {
                enabled = true
                enabled = ${?HTC_LB_PREDICTION_ENABLED}
                prediction-window-seconds = 10.0
                prediction-window-seconds = ${?HTC_LB_PREDICTION_WINDOW}
                flow-vector-samples = 100
                flow-vector-samples = ${?HTC_LB_PREDICTION_SAMPLES}
            }

            # Shard migration
            migration {
                max-concurrent = 3
                max-concurrent = ${?HTC_LB_MIGRATION_MAX_CONCURRENT}
                buffer-size = 10000
                buffer-size = ${?HTC_LB_MIGRATION_BUFFER_SIZE}

                # Migration Window Protocol (distributed barrier)
                # Delay (ms) after notifying entities before broadcasting MigrationWindowOpenEvent.
                # Gives entities time to save their snapshots before the window flag is set.
                window-open-delay-ms = 200
                window-open-delay-ms = ${?HTC_LB_MIGRATION_WINDOW_OPEN_DELAY_MS}

                # How long (ms) to wait for all cluster nodes to ACK MigrationWindowOpenEvent.
                # If any node misses the ACK within this window, migration still proceeds
                # (subscriber may be starting up; entities on that node will do normal init).
                window-open-ack-timeout-ms = 5000
                window-open-ack-timeout-ms = ${?HTC_LB_MIGRATION_WINDOW_ACK_TIMEOUT_MS}

                # How long (ms) to wait for all migrated entities to ACK that they restored.
                # Increase for large batches or slow deserialization (e.g. state with large maps).
                restore-ack-timeout-ms = 30000
                restore-ack-timeout-ms = ${?HTC_LB_MIGRATION_RESTORE_ACK_TIMEOUT_MS}

                # How long (ms) to wait for all nodes to ACK MigrationWindowCloseEvent.
                window-close-ack-timeout-ms = 5000
                window-close-ack-timeout-ms = ${?HTC_LB_MIGRATION_WINDOW_CLOSE_ACK_TIMEOUT_MS}
            }
        }

        snapshot-manager {
            migration {
                # State preservation during shard hand-off
                # "redis"    — shared store, survives LBM crash, required for multi-node
                # "inmemory" — fast, singleton-hosted, single-node/testing only
                state-store = "inmemory"
                state-store = ${?HTC_LB_MIGRATION_STATE_STORE}

                state-ttl-seconds = 300
                state-ttl-seconds = ${?HTC_LB_MIGRATION_STATE_TTL}
            }
        }

        brokers {
            kafka {
                bootstrap-servers = "localhost:9092"
                bootstrap-servers = ${?HTC_KAFKA_BOOTSTRAP_SERVERS}

                consumer {
                    group-id-suffix = "htc-group"
                    group-id-suffix = ${?HTC_KAFKA_GROUP_ID_SUFFIX}
                    auto-offset-reset = "earliest"
                    auto-offset-reset = ${?HTC_KAFKA_AUTO_OFFSET_RESET}
                    max-poll-records = 500
                    max-poll-records = ${?HTC_KAFKA_MAX_POLL_RECORDS}
                    enable-auto-commit = true
                    enable-auto-commit = ${?HTC_KAFKA_ENABLE_AUTO_COMMIT}
                }

                producer {
                    acks = "all"
                    acks = ${?HTC_KAFKA_PRODUCER_ACKS}
                    retries = 3
                    retries = ${?HTC_KAFKA_PRODUCER_RETRIES}
                    batch-size = 16384
                    batch-size = ${?HTC_KAFKA_PRODUCER_BATCH_SIZE}
                    linger-ms = 5
                    linger-ms = ${?HTC_KAFKA_PRODUCER_LINGER_MS}
                    compression-type = "snappy"
                    compression-type = ${?HTC_KAFKA_PRODUCER_COMPRESSION_TYPE}
                }

                topics {
                    events = "htc.events"
                    events = ${?HTC_KAFKA_EVENTS_TOPIC}
                    
                    reports = "htc.reports"
                    reports = ${?HTC_KAFKA_REPORTS_TOPIC}
                    
                    commands = "htc.commands"
                    commands = ${?HTC_KAFKA_COMMANDS_TOPIC}
                    
                    state-sync = "htc.state-sync"
                    state-sync = ${?HTC_KAFKA_STATE_SYNC_TOPIC}
                    
                    route-requests = "htc.route-requests"
                    route-requests = ${?HTC_KAFKA_ROUTE_REQUESTS_TOPIC}
                    
                    route-responses = "htc.route-responses"  
                    route-responses = ${?HTC_KAFKA_ROUTE_RESPONSES_TOPIC}
                    
                    status = "htc.status"
                    status = ${?HTC_KAFKA_STATUS_TOPIC}
                    
                    custom-reports = "htc.custom-reports"
                    custom-reports = ${?HTC_KAFKA_CUSTOM_REPORTS_TOPIC}
                }

                integrations {
                    event-streaming {
                        enabled = false
                        enabled = ${?HTC_KAFKA_EVENT_STREAMING_ENABLED}
                        batch-size = 100
                        batch-size = ${?HTC_KAFKA_EVENT_STREAMING_BATCH_SIZE}
                        use-avro = false
                        use-avro = ${?HTC_KAFKA_EVENT_STREAMING_USE_AVRO}
                    }
                    
                    reporting {
                        enabled = false
                        enabled = ${?HTC_KAFKA_REPORTING_ENABLED}
                        batch-size = 50
                        batch-size = ${?HTC_KAFKA_REPORTING_BATCH_SIZE}
                        use-avro = false
                        use-avro = ${?HTC_KAFKA_REPORTING_USE_AVRO}
                    }
                    
                    state-sync {
                        enabled = false
                        enabled = ${?HTC_KAFKA_STATE_SYNC_ENABLED}
                        sync-interval = 1000
                        sync-interval = ${?HTC_KAFKA_STATE_SYNC_INTERVAL}
                        use-avro = true
                        use-avro = ${?HTC_KAFKA_STATE_SYNC_USE_AVRO}
                    }
                    
                    command-control {
                        enabled = false
                        enabled = ${?HTC_KAFKA_COMMAND_CONTROL_ENABLED}
                    }
                    
                    external-integration {
                        enabled = false
                        enabled = ${?HTC_KAFKA_EXTERNAL_INTEGRATION_ENABLED}
                        timeout-ms = 30000
                        timeout-ms = ${?HTC_KAFKA_EXTERNAL_INTEGRATION_TIMEOUT}
                    }
                    
                    vehicle-streaming {
                        enabled = false
                        enabled = ${?HTC_KAFKA_VEHICLE_STREAMING_ENABLED}
                        use-avro = true
                        batch-size = 1000
                        batch-size = ${?HTC_KAFKA_VEHICLE_STREAMING_BATCH_SIZE}
                    }
                    
                    micro-simulation {
                        enabled = false
                        enabled = ${?HTC_KAFKA_MICRO_SIMULATION_ENABLED}
                        use-avro = true
                        batch-size = 5000
                        batch-size = ${?HTC_KAFKA_MICRO_SIMULATION_BATCH_SIZE}
                    }
                }
            }
        }

        simulation {
            # random-seed = 12345
            # random-seed = ${?HTC_RANDOM_SEED}
        }

        # 🚗 DYNAMIC ROUTING CONFIGURATION
        routing {
            # Enable dynamic weight calculation based on traffic conditions
            use-dynamic-weights = true
            use-dynamic-weights = ${?HTC_USE_DYNAMIC_WEIGHTS}

            # Cache strategy: "kafka" (recommended) | "redis" | "inmemory"
            #
            # kafka:
            #   - LinkActors publish → Kafka topic → all nodes consume
            #   - ~10ns local reads (ultra-fast A* calculation)
            #   - Eventually consistent (~100ms realistic lag)
            #   - Best for: multi-node clusters with high-frequency routing
            #
            # redis:
            #   - Single Redis instance shared by cluster
            #   - ~1ms network latency
            #   - Immediate consistency
            #   - Legacy option for simpler deployments
            #
            # inmemory:
            #   - Local ConcurrentHashMap + Pekko Distributed Data
            #   - ~10ns local reads (ultra-fast!)
            #   - Eventually consistent (~10-50ms sync)
            #   - Best for: single-node or when eventual consistency OK
            #
            cache-strategy = "inmemory"
            cache-strategy = ${?HTC_CACHE_STRATEGY}

            # How often DynamicWeightCache prints its query counter to stdout.
            # 0 = disabled. Default 10_000_000 (one line per ~10M queries).
            # At SP scale (~25B queries) this produces ~2500 lines vs 250000 at 100k.
            dynamic-weight-log-interval = 10000000
            dynamic-weight-log-interval = ${?HTC_DYNAMIC_WEIGHT_LOG_INTERVAL}

            link-cost {
                publish-interval = 10
                publish-interval = ${?HTC_LINK_COST_PUBLISH_INTERVAL}

                cache-ttl = 60
                cache-ttl = ${?HTC_LINK_COST_CACHE_TTL}

                congestion-weight = 2.0
                congestion-weight = ${?HTC_CONGESTION_WEIGHT}
                incident-weight = 10.0
                incident-weight = ${?HTC_INCIDENT_WEIGHT}
                speed-reduction-threshold = 0.5
                speed-reduction-threshold = ${?HTC_SPEED_REDUCTION_THRESHOLD}

                incident-multiplier = 2.0
                incident-multiplier = ${?HTC_INCIDENT_COST_MULTIPLIER}
            }

            # ── Contraction Hierarchies adaptive rebuild policy ────────────────────
            # Controls when the CH index is rebuilt during simulation.
            #
            # rebuild-block-threshold-factor:
            #   Rebuild immediately if any link's dynamic weight exceeds
            #   staticWeight × factor. Default 5.0 = link costs 5× free-flow time
            #   (e.g. accident, road closure). Normal congestion (1.2–2×) is
            #   intentionally ignored to avoid unnecessary rebuilds.
            #
            # rebuild-scheduled-ticks:
            #   Force a rebuild at these specific global simulation ticks.
            #   Defaults assume 1 tick = 1 second, simulation starting at midnight:
            #     0     → simulation start (always rebuild on first use)
            #     25200 → 07:00 morning peak
            #     43200 → 12:00 midday
            #     61200 → 17:00 evening peak
            #     72000 → 20:00 end of peak / night
            #   Adjust to match your simulation tick duration and time window.
            ch {
                rebuild-block-threshold-factor = 5.0
                rebuild-block-threshold-factor = ${?HTC_CH_BLOCK_THRESHOLD_FACTOR}
                rebuild-scheduled-ticks = [0, 25200, 43200, 61200, 72000]
            }
        }

        kafka {
            bootstrap.servers = "localhost:9092"
            bootstrap.servers = ${?KAFKA_BOOTSTRAP_SERVERS}

            topic {
                environment-prefix = "dev"
                environment-prefix = ${?HTC_KAFKA_ENV_PREFIX}
                
                dynamic-costs {
                    name = "dev.htc.routing.dynamic-costs.v1"
                    partitions = 12  # Scale with cluster size
                    replication.factor = 3
                    retention.ms = 300000
                    cleanup.policy = "delete"
                }
            }
            
            producer {
                acks = "1"
                retries = 3
                batch.size = 16384
                linger.ms = 5  #
                compression.type = "snappy"
                max.in.flight.requests.per.connection = 5
            }
            
            topics {
                auto-create = true
                auto-create = ${?HTC_KAFKA_AUTO_CREATE_TOPICS}
                
                creation-timeout = 30
            }
            
            schema-registry {
                url = "http://localhost:8081"
                url = ${?HTC_SCHEMA_REGISTRY_URL}
                
                auto-register = true
                auto-register = ${?HTC_SCHEMA_AUTO_REGISTER}
            }
            
            consumer {
                auto.offset.reset = "latest"
                enable.auto.commit = true
                auto.commit.interval.ms = 1000
                max.poll.records = 500
                fetch.min.bytes = 1
                fetch.max.wait.ms = 100
            }
        }

        monitoring {
            cache-stats-interval = 30
            cache-stats-interval = ${?HTC_CACHE_STATS_INTERVAL}
            
            routing-stats-enabled = true
            routing-stats-enabled = ${?HTC_ROUTING_STATS_ENABLED}
            routing-stats-interval = 60
            routing-stats-interval = ${?HTC_ROUTING_STATS_INTERVAL}
        }
    }

    pekko.kafka.consumer {
        kafka-clients {
            bootstrap.servers = ${htc.kafka.bootstrap.servers}
            auto.offset.reset = ${htc.kafka.consumer.auto.offset.reset}
            enable.auto.commit = ${htc.kafka.consumer.enable.auto.commit}
        }
    }