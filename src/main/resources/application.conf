pekko {
    loglevel = "INFO"
    stdout-loglevel = "INFO"

    # Dispatcher for I/O operations (file loading, Kafka produce/consume)
    # Uses virtual threads on Java 21+ for blocking I/O operations.
    actor.io-dispatcher {
        type = "Dispatcher"
        executor = "fork-join-executor"
        fork-join-executor {
            parallelism-min = 4
            parallelism-max = 8
            parallelism-factor = 1.0
            virtualize = on
        }
        throughput = 10
    }
    loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
    logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
    log-dead-letters-during-shutdown = off
    log-dead-letters = off

    actor {
        provider = cluster

        debug {
            receive = off
            lifecycle = off
            unhandled = off
            autoreceive = off
        }
        allow-java-serialization = off
        serializers {
            proto = "org.apache.pekko.remote.serialization.ProtobufSerializer"
            envelope = "org.interscity.htc.core.serializer.EntityEnvelopeSerializer"
            actor-interaction = "org.interscity.htc.core.serializer.ActorInteractionSerializer"
            jackson-json = "org.apache.pekko.serialization.jackson.JacksonJsonSerializer"
            jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
        }
        serialization-bindings {
            "org.interscity.htc.core.entity.event.EntityEnvelopeEvent" = envelope
            "scalapb.GeneratedMessage" = proto
            "org.interscity.htc.core.entity.event.ActorInteractionEvent" = actor-interaction
            "org.interscity.htc.core.entity.event.control.execution.TimeManagerRegisterEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.execution.LocalTimeWindowReport" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.execution.UpdateGlobalTimeWindow" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.CreateActorsEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.FinishCreationEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.FinishLoadDataEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.LoadDataCreatorRegisterEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.InitializeEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.LoadDataEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.data.BaseEventData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.MicroEnterLinkData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.MicroLeaveLinkData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.MicroUpdateData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.MicroStepData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.LaneChangeData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.FollowingUpdateData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.IntersectionMicroData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.MicroTicksCompleted" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.GlobalTickEvent" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.person.StartTripData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.person.TripCompletedData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.person.ParkVehicleData" = jackson-cbor
            "org.interscity.htc.model.hybrid.entity.event.data.person.ModeChoiceDecision" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.report.RegisterReportersEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.report.ReportEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.LoadDataSourceEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.TickIndexBuiltEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.TickRangeLoadedEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.LoadActorsForTickRange" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.LoadNextEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.ProcessBatchesEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.ProcessNextCreateChunk" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.SendBatchToCreators" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.ProcessNextFileChunk" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.CloseAndFinish" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.StartLoadingFile" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.ProcessNextChunk" = jackson-cbor
            "org.interscity.htc.core.entity.event.control.load.RetryPendingAcks" = jackson-cbor
            "org.interscity.htc.core.entity.event.SpontaneousEvent" = jackson-cbor
            "org.interscity.htc.core.entity.event.FinishEvent" = jackson-cbor
            "org.interscity.htc.core.actor.ActorSerializable" = jackson-cbor
            "org.interscity.htc.core.entity.actor.properties.Properties" = jackson-cbor
            "org.interscity.htc.core.entity.actor.properties.CreatorProperties" = jackson-cbor
            "org.interscity.htc.core.entity.state.BaseState" = jackson-cbor
            "java.time.LocalDateTime" = jackson-cbor
        }
    }

    persistence {
          journal {
            plugin = "pekko.persistence.journal.inmem"
            inmem {
                class = "org.apache.pekko.persistence.journal.inmem.InmemJournal"
            }
          }
          snapshot-store {
            plugin = "pekko.persistence.snapshot-store.local"
            local {
              class = "org.apache.pekko.persistence.snapshot.local.LocalSnapshotStore"
              dir = "/app/hyperbolic-time-chamber/snapshots"
            }
          }
    }

    remote {
        artery {
            canonical {
                hostname = ${clustering.ip}
                port = ${clustering.port}
            }
        }
    }

    cluster {
        downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

        # SBR: be VERY conservative before downing nodes.
        # With inmem persistence, a downed node = permanent shard loss.
        # Wait long enough for CPU spikes / GC pauses to resolve.
        split-brain-resolver {
            # Wait 60s of sustained unreachability before downing (default: 20s).
            # Prevents false downing during CPU saturation or GC pauses.
            stable-after = 60s
            stable-after = ${?HTC_SBR_STABLE_AFTER}

            # Default strategy: keep-majority (safe for N>=3 nodes)
            active-strategy = keep-majority

            # Extra safety: if a node becomes unreachable but recovers
            # within down-all-when-unstable window, don't down it.
            down-all-when-unstable = off
        }

        seed-nodes = [
            "pekko://"${clustering.cluster.name}"@"${clustering.seed-ip}":"${clustering.seed-port}
        ]

        failure-detector {
            # GENEROUS thresholds — avoid false positives under heavy CPU load.
            # A downed pod = permanent shard loss (inmem persistence).
            # Better to wait longer than to incorrectly remove a busy node.
            acceptable-heartbeat-pause = 120 s  # was 30s — allow CPU saturation spikes
            acceptable-heartbeat-pause = ${?HTC_HEARTBEAT_PAUSE}
            threshold = 30.0                    # was 20.0 — more tolerant phi-accrual
            expected-response-after = 20 s      # was 10s — network + CPU delays
            heartbeat-interval = 5 s            # default 1s — reduce heartbeat traffic
        }

        sharding {
            passivation {
                strategy = "default-idle-strategy"
                default-idle-strategy {
                  idle-entity.timeout = 1200.hours
                }
            }

            least-shard-allocation-strategy {
                # KEEP HIGH: inmem persistence means rebalanced shards lose state.
                # With min-nr-of-members, all pods join BEFORE initial allocation,
                # so shards are distributed evenly from the start.
                # Rebalancing should only happen if a pod permanently dies.
                rebalance-threshold = 100000
            }

            # Default Pekko buffer is 1000 — far too small when the progressive
            # loader streams ~1500+ CreateActor messages per tick window.
            # Messages are queued here while ShardCoordinator allocates shards;
            # overflow causes silent actor-creation drops and stalled ticks.
            # Set large enough to absorb one full wave of progressive-load bursts.
            buffer-size = 100000
            buffer-size = ${?HTC_SHARD_BUFFER_SIZE}

            verbose-debug-logging = off
            waiting-for-state-timeout = 1 minute
        }
    }

    cluster.bootstrap {
        contact-point-discovery {
            service-name  = "pekko-node"
            port-name     = "management"
            protocol      = "http"
        }
    }

    management {
        http {
            hostname = "0.0.0.0"
            port = ${clustering.management-http-port}
        }
    }

    discovery {
        method = config
    }
}

clustering {
    ip = "127.0.0.1"
    ip = ${?CLUSTER_IP}
    port = 1600
    port = ${?CLUSTER_PORT}
    seed-ip = "127.0.0.1"
    seed-ip = ${?CLUSTER_IP}
    seed-ip = ${?SEED_PORT_1600_TCP_ADDR}
    seed-port = 1600
    seed-port = ${?SEED_PORT_1600_TCP_PORT}
    management-http-port = 8558
    management-http-port = ${?MANAGEMENT_HTTP_PORT}
    cluster.name = hyperbolic-time-chamber
}

htc {
        simulation {
            config-file = ${?HTC_SIMULATION_CONFIG_FILE}
            snapshot-interval = 10000000
        }
        time-manager {
            total-instances = 50
            total-instances = ${?HTC_TIME_MANAGER_INSTANCES}

            max-instances-per-node = 1
            max-instances-per-node = ${?HTC_TIME_MANAGER_PER_NODE}

            batch-size = 100000

            lookahead-window = 1
            lookahead-window = ${?HTC_TIME_MANAGER_LOOKAHEAD}

            metrics-log-interval = 500
            metrics-log-interval = ${?HTC_TIME_MANAGER_METRICS_INTERVAL}

            window-size = 1
            window-size = ${?HTC_TIME_MANAGER_WINDOW_SIZE}

            verbose-logging = true
            verbose-logging = ${?HTC_TIME_MANAGER_VERBOSE_LOGGING}

            snapshot-interval = 10000000
            snapshot-interval = ${?HTC_TIME_MANAGER_SNAPSHOT_INTERVAL}

            actor-timeout-ms = 180000
            actor-timeout-ms = ${?HTC_TIME_MANAGER_ACTOR_TIMEOUT_MS}

            sync-timeout-ms = 30000
            sync-timeout-ms = ${?HTC_TIME_MANAGER_SYNC_TIMEOUT_MS}

            stale-event-max-age-ms = 30000
            stale-event-max-age-ms = ${?HTC_TIME_MANAGER_STALE_EVENT_MAX_AGE_MS}

            health-check-interval-seconds = 120
            health-check-interval-seconds = ${?HTC_TIME_MANAGER_HEALTH_CHECK_INTERVAL}
        }


    report-manager {
        default-strategy = "json"
        enabled-strategies = ["json"]

        csv {
            prefix = "htc_simulation_"
            directory = "/app/hyperbolic-time-chamber/output/reports/csv"
            number-of-instances = 2
            number-of-instances-per-node = 1
            batch-size = 1000
        }

        json {
            prefix = "htc_simulation_"
            directory = "/app/hyperbolic-time-chamber/output/reports/json"
            number-of-instances = 256
            number-of-instances = ${?HTC_REPORT_JSON_INSTANCES}
            number-of-instances-per-node = 256
            number-of-instances-per-node = ${?HTC_REPORT_JSON_PER_NODE}
            batch-size = 100
            batch-size = ${?HTC_REPORT_JSON_BATCH_SIZE}
        }
    }

    brokers {
        kafka {
            bootstrap-servers = "localhost:9092"
            bootstrap-servers = ${?HTC_KAFKA_BOOTSTRAP_SERVERS}

            consumer {
                group-id-suffix = "htc-group"
                group-id-suffix = ${?HTC_KAFKA_GROUP_ID_SUFFIX}
                auto-offset-reset = "earliest"
                auto-offset-reset = ${?HTC_KAFKA_AUTO_OFFSET_RESET}
                max-poll-records = 500
                max-poll-records = ${?HTC_KAFKA_MAX_POLL_RECORDS}
                enable-auto-commit = true
                enable-auto-commit = ${?HTC_KAFKA_ENABLE_AUTO_COMMIT}
            }

            producer {
                acks = "all"
                acks = ${?HTC_KAFKA_PRODUCER_ACKS}
                retries = 3
                retries = ${?HTC_KAFKA_PRODUCER_RETRIES}
                batch-size = 16384
                batch-size = ${?HTC_KAFKA_PRODUCER_BATCH_SIZE}
                linger-ms = 5
                linger-ms = ${?HTC_KAFKA_PRODUCER_LINGER_MS}
                compression-type = "snappy"
                compression-type = ${?HTC_KAFKA_PRODUCER_COMPRESSION_TYPE}
            }

            # Topic configurations for different HTC modules
            topics {
                events = "htc.events"
                events = ${?HTC_KAFKA_EVENTS_TOPIC}
                
                reports = "htc.reports"
                reports = ${?HTC_KAFKA_REPORTS_TOPIC}
                
                commands = "htc.commands"
                commands = ${?HTC_KAFKA_COMMANDS_TOPIC}
                
                state-sync = "htc.state-sync"
                state-sync = ${?HTC_KAFKA_STATE_SYNC_TOPIC}
                
                route-requests = "htc.route-requests"
                route-requests = ${?HTC_KAFKA_ROUTE_REQUESTS_TOPIC}
                
                route-responses = "htc.route-responses"  
                route-responses = ${?HTC_KAFKA_ROUTE_RESPONSES_TOPIC}
                
                status = "htc.status"
                status = ${?HTC_KAFKA_STATUS_TOPIC}
                
                custom-reports = "htc.custom-reports"
                custom-reports = ${?HTC_KAFKA_CUSTOM_REPORTS_TOPIC}
            }

            # Enable/disable Kafka integration per module
            integrations {
                event-streaming {
                    enabled = false
                    enabled = ${?HTC_KAFKA_EVENT_STREAMING_ENABLED}
                    batch-size = 100
                    batch-size = ${?HTC_KAFKA_EVENT_STREAMING_BATCH_SIZE}
                    # Use Avro for high-performance event streaming
                    use-avro = false
                    use-avro = ${?HTC_KAFKA_EVENT_STREAMING_USE_AVRO}
                }
                
                reporting {
                    enabled = false
                    enabled = ${?HTC_KAFKA_REPORTING_ENABLED}
                    batch-size = 50
                    batch-size = ${?HTC_KAFKA_REPORTING_BATCH_SIZE}
                    # Use Avro for high-performance reporting (3-5x faster than JSON)
                    use-avro = false
                    use-avro = ${?HTC_KAFKA_REPORTING_USE_AVRO}
                }
                
                state-sync {
                    enabled = false
                    enabled = ${?HTC_KAFKA_STATE_SYNC_ENABLED}
                    sync-interval = 1000
                    sync-interval = ${?HTC_KAFKA_STATE_SYNC_INTERVAL}
                    # Use Avro for state sync (smaller payloads, faster)
                    use-avro = true
                    use-avro = ${?HTC_KAFKA_STATE_SYNC_USE_AVRO}
                }
                
                command-control {
                    enabled = false
                    enabled = ${?HTC_KAFKA_COMMAND_CONTROL_ENABLED}
                }
                
                external-integration {
                    enabled = false
                    enabled = ${?HTC_KAFKA_EXTERNAL_INTEGRATION_ENABLED}
                    timeout-ms = 30000
                    timeout-ms = ${?HTC_KAFKA_EXTERNAL_INTEGRATION_TIMEOUT}
                }
                
                # High-performance Avro streaming for vehicle data
                vehicle-streaming {
                    enabled = false
                    enabled = ${?HTC_KAFKA_VEHICLE_STREAMING_ENABLED}
                    # Always use Avro for vehicle data (high volume)
                    use-avro = true
                    batch-size = 1000
                    batch-size = ${?HTC_KAFKA_VEHICLE_STREAMING_BATCH_SIZE}
                }
                
                # High-performance Avro streaming for micro simulation
                micro-simulation {
                    enabled = false
                    enabled = ${?HTC_KAFKA_MICRO_SIMULATION_ENABLED}
                    # Always use Avro for micro updates (very high frequency)
                    use-avro = true
                    batch-size = 5000
                    batch-size = ${?HTC_KAFKA_MICRO_SIMULATION_BATCH_SIZE}
                }
            }
        }
    }

    simulation {
        # random-seed = 12345
        # random-seed = ${?HTC_RANDOM_SEED}
    }

    # 🚗 DYNAMIC ROUTING CONFIGURATION
    routing {
        # Enable dynamic weight calculation based on traffic conditions
        use-dynamic-weights = true
        use-dynamic-weights = ${?HTC_USE_DYNAMIC_WEIGHTS}

        # Cache strategy: "kafka" (recommended) | "redis" | "inmemory"
        #
        # kafka:
        #   - LinkActors publish → Kafka topic → all nodes consume
        #   - ~10ns local reads (ultra-fast A* calculation)
        #   - Eventually consistent (~100ms realistic lag)
        #   - Best for: multi-node clusters with high-frequency routing
        #
        # redis:
        #   - Single Redis instance shared by cluster
        #   - ~1ms network latency
        #   - Immediate consistency
        #   - Legacy option for simpler deployments
        #
        # inmemory:
        #   - Local ConcurrentHashMap + Pekko Distributed Data
        #   - ~10ns local reads (ultra-fast!)
        #   - Eventually consistent (~10-50ms sync)
        #   - Best for: single-node or when eventual consistency OK
        #
        cache-strategy = "kafka"
        cache-strategy = ${?HTC_CACHE_STRATEGY}

        # Link cost publishing configuration
        link-cost {
            # How often LinkActors publish dynamic costs (ticks)
            publish-interval = 10
            publish-interval = ${?HTC_LINK_COST_PUBLISH_INTERVAL}

            # Cache TTL - not used by Kafka (uses retention policy)
            cache-ttl = 60
            cache-ttl = ${?HTC_LINK_COST_CACHE_TTL}

            # Cost calculation factors
            congestion-weight = 2.0      # Multiply base cost by congestion
            congestion-weight = ${?HTC_CONGESTION_WEIGHT}
            incident-weight = 10.0       # Heavy penalty for accidents  
            incident-weight = ${?HTC_INCIDENT_WEIGHT}
            speed-reduction-threshold = 0.5  # When to apply congestion penalty
            speed-reduction-threshold = ${?HTC_SPEED_REDUCTION_THRESHOLD}

            # Multiplier for incident impact on link cost
            # incidents add: incident-multiplier * base-cost to total cost
            incident-multiplier = 2.0
            incident-multiplier = ${?HTC_INCIDENT_COST_MULTIPLIER}
        }
    }

    # 📡 KAFKA CONFIGURATION FOR DYNAMIC WEIGHT DISTRIBUTION
    #
    # LinkActors publish dynamic costs to Kafka topic "dynamic-link-costs"
    # All cluster nodes consume and maintain local cache for ultra-fast routing
    #
    # Benefits:
    # - Sub-microsecond local reads during A* calculation
    # - Automatic fault tolerance and replay via Kafka
    # - Realistic eventual consistency (like real traffic info)
    # - Scales to millions of links with minimal overhead
    kafka {
        # Kafka cluster connection
        bootstrap.servers = "localhost:9092"
        bootstrap.servers = ${?KAFKA_BOOTSTRAP_SERVERS}
        
        # Topic configuration  
        topic {
            # Environment prefix for topic isolation
            environment-prefix = "dev"
            environment-prefix = ${?HTC_KAFKA_ENV_PREFIX}
            
            dynamic-costs {
                # Use standardized naming: {env}.htc.routing.dynamic-costs.v1
                name = "dev.htc.routing.dynamic-costs.v1"
                partitions = 12  # Scale with cluster size
                replication.factor = 3
                retention.ms = 300000  # 5 minutes (traffic changes fast)
                cleanup.policy = "delete"
            }
        }
        
        # Producer settings (LinkActors publishing costs)
        producer {
            acks = "1"  # Leader ack (balance speed/reliability)
            retries = 3
            batch.size = 16384
            linger.ms = 5  # Small batching for low latency
            compression.type = "snappy"  # Fast compression
            max.in.flight.requests.per.connection = 5
        }
        
        # Topic auto-creation
        topics {
            # Auto-create topics on startup
            auto-create = true
            auto-create = ${?HTC_KAFKA_AUTO_CREATE_TOPICS}
            
            # Timeout for topic creation (seconds)
            creation-timeout = 30
        }
        
        # Schema Registry configuration (for Avro schemas)
        schema-registry {
            url = "http://localhost:8081"
            url = ${?HTC_SCHEMA_REGISTRY_URL}
            
            # Auto-register schemas on startup
            auto-register = true
            auto-register = ${?HTC_SCHEMA_AUTO_REGISTER}
        }
        
        # Consumer settings (route calculators receiving updates)
        consumer {
            auto.offset.reset = "latest"  # Only new messages
            enable.auto.commit = true
            auto.commit.interval.ms = 1000
            max.poll.records = 500  # Batch processing
            fetch.min.bytes = 1
            fetch.max.wait.ms = 100  # Low latency
        }
    }

    # 📊 PERFORMANCE MONITORING
    monitoring {
        # Log cache statistics every N seconds
        cache-stats-interval = 30
        cache-stats-interval = ${?HTC_CACHE_STATS_INTERVAL}
        
        # Log routing performance metrics
        routing-stats-enabled = true
        routing-stats-enabled = ${?HTC_ROUTING_STATS_ENABLED}
        routing-stats-interval = 60
        routing-stats-interval = ${?HTC_ROUTING_STATS_INTERVAL}
    }
}

# Pekko Kafka consumer configuration
pekko.kafka.consumer {
    kafka-clients {
        bootstrap.servers = ${htc.kafka.bootstrap.servers}
        auto.offset.reset = ${htc.kafka.consumer.auto.offset.reset}
        enable.auto.commit = ${htc.kafka.consumer.enable.auto.commit}
    }
}