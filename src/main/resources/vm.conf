include "application"

pekko {
  # === DISPATCHER STRATEGY — VM 64 vCPUs ===
  # 1. default-dispatcher: CPU-bound simulation actors (Car, Link, Node, …) → Platform Threads (FJP)
  #    parallelism-factor=1.0 → 1 thread por vCPU (evita oversubscription do FJP).
  #    throughput=10: cada ator processa poucas mensagens antes de devolver a thread.
  #    Importante quando alguns atores executam A* longo (GPSUtil.calcRoute*) — não devem
  #    monopolizar a thread enquanto outros atores aguardam.
  # 2. routing-dispatcher: dispatcher dedicado para trabalho pesado de roteamento (A*/ALT/CH).
  #    Isolado do default para que cálculos de rota não afoguem o restante da simulação.
  # 3. cluster-dispatcher: dispatcher dedicado e isolado para o subsistema Cluster do Pekko.
  #    Heartbeats / failure detection NÃO podem competir com o workload da simulação,
  #    senão geram falsos positivos de UNREACHABLE sob carga alta.
  # 4. io-dispatcher: I/O-bound (Kafka, Redis, relatórios) → Virtual Threads (Loom).
  #    Herdado de application.conf (virtual-thread-executor) — sem override necessário.
  actor.default-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min = 32
      parallelism-factor = 1.0    # 64 × 1.0 = 64 threads = 1 por vCPU
      parallelism-max = 64
      virtualize = off
    }
    # throughput=10 reduz o tempo que um ator monopoliza a thread.
    # Com A* longo no caminho, melhor processar pouco e devolver a thread.
    throughput = 10
  }

  # === Dispatcher dedicado para roteamento (A*/ALT/CH) ===
  # Use a partir de código com:
  #   import org.interscity.htc.core.system.dispatcher.RoutingDispatcher
  #   implicit val ec: ExecutionContext = RoutingDispatcher.executionContext(context.system)
  #   Future { GPSUtil.calcRouteCompact(...) }.pipeTo(self)
  routing-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min = 16
      parallelism-factor = 0.5
      parallelism-max = 32
    }
    throughput = 1
  }

  # === Dispatcher dedicado e isolado para Cluster ===
  # Heartbeats NÃO podem competir com workload simulação.
  cluster-dispatcher {
    type = Dispatcher
    executor = "fork-join-executor"
    fork-join-executor {
      parallelism-min = 4
      parallelism-max = 8
    }
    throughput = 1
  }
}

# Cluster usa o dispatcher isolado acima e tem failure detector mais tolerante para
# cargas altas em VM single-node (evita falsos UNREACHABLE durante picos de simulação).
pekko.cluster {
  use-dispatcher = "pekko.cluster-dispatcher"
  failure-detector {
    acceptable-heartbeat-pause = 30s
    threshold = 12.0
  }
}
