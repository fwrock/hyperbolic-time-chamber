include "application"

pekko {
  # === DISPATCHER STRATEGY ===
  # 1. internal-dispatcher: I/O-bound (heartbeats, gossip, remoting) → Virtual Threads
  # 2. default-dispatcher: CPU-bound (simulation actors) → Platform Threads (ForkJoin)
  # 3. io-dispatcher: I/O-bound (file loading, Kafka) → Virtual Threads

  # Dispatcher for cluster-internal operations (heartbeats, gossip, SBR, remoting)
  # Also used by: ShardCoordinators, DData replicators, Artery remoting.
  # I/O-bound (network) → virtual-thread-executor: 1 VT per task, no pool contention.
  actor.internal-dispatcher {
    type = "Dispatcher"
    executor = "virtual-thread-executor"
    throughput = 5
  }

  # Default dispatcher for CPU-bound simulation actors (Car, Link, Node, etc)
  # Uses PLATFORM THREADS (ForkJoin) - virtual threads don't help CPU-bound workloads
  actor.default-dispatcher {
    fork-join-executor {
      parallelism-min = 4
      parallelism-max = 12
      parallelism-factor = 2.0
      # Keep platform threads for CPU-intensive calculations
      virtualize = off
    }
    throughput = 30
  }

  # Dispatcher for I/O operations: file loading, Kafka, AND report writing.
  # Report writers (JsonReportData) use .withDispatcher("pekko.actor.io-dispatcher")
  # to avoid blocking the default-dispatcher ForkJoin threads.
  # Uses virtual-thread-executor (Project Loom): 1 VT per task, no pool contention.
  # Simpler and more efficient than fork-join-executor + virtualize=on.
  actor.io-dispatcher {
    executor = "virtual-thread-executor"
    throughput = 10
  }

  # === ASSIGN DISPATCHERS TO SUBSYSTEMS ===
  # Route all cluster/remoting operations to internal-dispatcher (virtual threads for network I/O)
  
  # Remoting (Artery): heartbeats, system messages, network streams
  remote.artery {
    advanced {
      maximum-frame-size = 2 MiB
      maximum-large-frame-size = 4 MiB
      use-dispatcher = "pekko.actor.internal-dispatcher"
    }
  }

  # Cluster: membership, gossip, failure detection
  cluster {
    use-dispatcher = "pekko.actor.internal-dispatcher"

    # On Kubernetes, rely on Pekko Cluster Bootstrap discovery (kubernetes-api)
    # instead of static seed nodes to avoid seed/bootstrap conflicts.
    seed-nodes = []

    # Wait for N members to join before marking any as "Up".
    # This ensures ALL pods participate in initial shard allocation,
    # preventing empty pods (shards distributed only to early joiners).
    # Set via HTC_MIN_CLUSTER_MEMBERS env var. Default 1 (no wait).
    min-nr-of-members = 1
    min-nr-of-members = ${?HTC_MIN_CLUSTER_MEMBERS}
    
    # Cluster Sharding: coordinators, region managers
    sharding.use-dispatcher = "pekko.actor.internal-dispatcher"
    
    # Distributed Data: replicators, CRDT operations
    distributed-data.ddata.use-dispatcher = "pekko.actor.internal-dispatcher"

    # Extra tolerance during heavy startup/loading phase on larger clusters.
    failure-detector {
      threshold = 60.0
      acceptable-heartbeat-pause = 180s
      acceptable-heartbeat-pause = ${?HTC_HEARTBEAT_PAUSE}
    }
  }

  discovery.method = kubernetes-api

  discovery.kubernetes-api {
    pod-label-selector = "app=htc-node"
    # Use raw pod IPs instead of constructed DNS names.
    # GKE Cloud DNS doesn't resolve <ip-dashed>.<ns>.pod.cluster.local hostnames.
    use-raw-ip = true
  }

  management {
    http {
      bind-hostname = "0.0.0.0"
      bind-port = 8558
      hostname = ${?POD_IP}
      hostname = ${?CLUSTER_IP}
      port = 8558
    }

    cluster.bootstrap {
      new-cluster-enabled = on

      contact-point-discovery {
        required-contact-point-nr = 3
        discovery-method = kubernetes-api
        service-name = "htc-simulator"
        port-name = "management"

        # Timeout for service discovery DNS/API responses.
        # Default 3s — increase because kubernetes-api + DNS can be slow under load.
        resolve-timeout = 10s

        # How long discovery results must be stable before joining.
        stable-margin = 5s
      }

      contact-point {
        # If a contact point keeps failing to connect for this long,
        # initiate rediscovery. Default 3s is FAR too short for 16-pod startup.
        probing-failure-timeout = 180s
      }
    }
  }
}

clustering.ip = ${?POD_IP}
clustering.ip = ${?CLUSTER_IP}