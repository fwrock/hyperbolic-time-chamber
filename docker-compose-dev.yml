---
# Docker Compose for HTC Development with Kafka
# Optimized for development environment with monitoring and debugging tools
services:

  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: htc-zookeeper-dev
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - zookeeper_data_dev:/var/lib/zookeeper/data
      - zookeeper_logs_dev:/var/lib/zookeeper/log

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: htc-kafka-dev
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      KAFKA_CONFLUENT_METRICS_ENABLE: 'true'
      KAFKA_CONFLUENT_SUPPORT_CUSTOMER_ID: anonymous
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      # Development optimizations
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 4
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    volumes:
      - kafka_data_dev:/var/lib/kafka/data

  # Schema Registry for Avro schemas
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: htc-schema-registry-dev
    hostname: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO

  # Kafka UI for monitoring and debugging
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: htc-kafka-ui-dev
    hostname: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: htc-dev-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      LOGGING_LEVEL_COM_PROVECTUS: INFO

  # Redis
  redis:
    image: redis:latest
    container_name: htc-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

  # HTC Node
  node1:
    build: .
    container_name: htc_node_dev
    hostname: node1
    depends_on:
      - redis
      - kafka
      - schema-registry
    ports:
      - "1600:1600"
      - "8558:8558"
    environment:
      # Cluster Configuration
      CLUSTER_PORT: 1600
      CLUSTER_IP: node1
      CLUSTER_NAME: node1
      SEED_PORT_1600_TCP_ADDR: node1
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Management
      MANAGEMENT_HTTP_PORT: 8558
      
      # Simulation Configuration
      HTC_SIMULATION_CONFIG_FILE: /app/hyperbolic-time-chamber/simulations/input/quick-test/simulation.json
      HTC_MOBILITY_CITY_MAP_FILE: /app/hyperbolic-time-chamber/simulations/input/quick-test/data/city_map.json
      
      # Time Manager Configuration (reduced for dev)
      HTC_TIME_MANAGER_INSTANCES: 4
      HTC_TIME_MANAGER_PER_NODE: 4
      HTC_TIME_MANAGER_LOOKAHEAD: 5
      HTC_TIME_MANAGER_WINDOW_SIZE: 10
      HTC_TIME_MANAGER_METRICS_INTERVAL: 100
      HTC_TIME_MANAGER_SNAPSHOT_INTERVAL: 5000
      HTC_TIME_MANAGER_ACTOR_TIMEOUT_MS: 60000
      HTC_TIME_MANAGER_SYNC_TIMEOUT_MS: 30000
      HTC_TIME_MANAGER_STALE_EVENT_MAX_AGE_MS: 30000
      HTC_TIME_MANAGER_HEALTH_CHECK_INTERVAL: 60
      
      # Report Manager Configuration  
      HTC_REPORT_CSV_INSTANCES: 2
      HTC_REPORT_CSV_PER_NODE: 1
      HTC_REPORT_JSON_INSTANCES: 4
      HTC_REPORT_JSON_PER_NODE: 2
      
      # === KAFKA CONFIGURATION ===
      HTC_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      HTC_KAFKA_GROUP_ID_SUFFIX: "htc-dev-group"
      HTC_KAFKA_AUTO_OFFSET_RESET: "earliest"
      
      # Kafka Topics
      HTC_KAFKA_EVENTS_TOPIC: "htc.events"
      HTC_KAFKA_REPORTS_TOPIC: "htc.reports.avro" 
      HTC_KAFKA_COMMANDS_TOPIC: "htc.commands"
      HTC_KAFKA_STATE_SYNC_TOPIC: "htc.state-sync.avro"
      HTC_KAFKA_ROUTE_REQUESTS_TOPIC: "htc.route-requests"
      HTC_KAFKA_ROUTE_RESPONSES_TOPIC: "htc.route-responses"
      HTC_KAFKA_STATUS_TOPIC: "htc.status"
      HTC_KAFKA_CUSTOM_REPORTS_TOPIC: "htc.custom-reports"
      
      # Kafka Producer Configuration
      HTC_KAFKA_PRODUCER_ACKS: "1"
      HTC_KAFKA_PRODUCER_RETRIES: "3" 
      HTC_KAFKA_PRODUCER_BATCH_SIZE: "16384"
      HTC_KAFKA_PRODUCER_LINGER_MS: "5"
      HTC_KAFKA_PRODUCER_COMPRESSION_TYPE: "snappy"
      
      # Kafka Consumer Configuration
      HTC_KAFKA_MAX_POLL_RECORDS: "500"
      HTC_KAFKA_ENABLE_AUTO_COMMIT: "true"
      
      # === KAFKA INTEGRATIONS (Development settings) ===
      HTC_KAFKA_EVENT_STREAMING_ENABLED: "true"
      HTC_KAFKA_EVENT_STREAMING_BATCH_SIZE: "50"
      HTC_KAFKA_EVENT_STREAMING_USE_AVRO: "false"
      
      HTC_KAFKA_REPORTING_ENABLED: "true"
      HTC_KAFKA_REPORTING_BATCH_SIZE: "25" 
      HTC_KAFKA_REPORTING_USE_AVRO: "true"
      
      HTC_KAFKA_STATE_SYNC_ENABLED: "false"
      HTC_KAFKA_STATE_SYNC_INTERVAL: "2000"
      HTC_KAFKA_STATE_SYNC_USE_AVRO: "true"
      
      HTC_KAFKA_COMMAND_CONTROL_ENABLED: "true"
      
      HTC_KAFKA_EXTERNAL_INTEGRATION_ENABLED: "true"
      HTC_KAFKA_EXTERNAL_INTEGRATION_TIMEOUT: "10000"
      
      # Vehicle streaming (reduced for dev)
      HTC_KAFKA_VEHICLE_STREAMING_ENABLED: "true"
      HTC_KAFKA_VEHICLE_STREAMING_BATCH_SIZE: "100"
      
      # Micro simulation streaming (disabled for dev)
      HTC_KAFKA_MICRO_SIMULATION_ENABLED: "false"
      HTC_KAFKA_MICRO_SIMULATION_BATCH_SIZE: "200"
    volumes:
      - /home/dean/hyperbolic-time-chamber:/app/hyperbolic-time-chamber

volumes:
  redis_data_dev:
  kafka_data_dev:
  zookeeper_data_dev:
  zookeeper_logs_dev: