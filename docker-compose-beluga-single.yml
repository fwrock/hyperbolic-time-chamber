---
services:
  # Redpanda — Kafka-protocol compatible broker with built-in schema registry.
  # No Zookeeper needed. network_mode: host to match the rest of this file
  # (Redis/node1 are also host-networked) so HTC_KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
  # resolves without a docker bridge network.
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: htc-redpanda
    hostname: redpanda
    network_mode: host
    command:
      - redpanda
      - start
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - localhost:9092
      - --schema-registry-addr
      - 0.0.0.0:8081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - localhost:33145
      - --pandaproxy-addr
      - 0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - localhost:18082
      - --smp
      - "4"
      - --memory
      - 8G
      - --reserve-memory
      - 0M
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

  # Redpanda Console — optional web UI for topics/consumer groups/schema registry.
  # Not required by the simulator at runtime; safe to drop this service if you
  # don't want the extra container. Available at http://localhost:8080
  redpanda-console:
    image: redpandadata/console:latest
    container_name: htc-redpanda-console
    hostname: redpanda-console
    network_mode: host
    depends_on:
      - redpanda
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["localhost:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://localhost:8081"]
      LOGGING_LEVEL_ROOT: WARN

  redis:
    image: redis:latest
    container_name: htc-redis
    network_mode: host
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
  node1:
    image: uxhabam/hyperbolic-time-chamber:3.0.11-beluga
    command: ["java", "-XX:+ZGenerational", "-jar", "app.jar"]
    cap_add:
      - SYS_NICE
    container_name: node_1
    depends_on:
      - redis
      - redpanda
    hostname: node1
    network_mode: host
    environment:
      CLUSTER_PORT: 1600
      CLUSTER_IP: 127.0.0.1
      CLUSTER_NAME: node1
      SEED_PORT_1600_TCP_ADDR: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MANAGEMENT_HTTP_PORT: 8558
      HTC_METRICS_PORT: 9101
      HTC_SCENARIO_NAME: sp_100pct
      HTC_SIMULATION_CONFIG_FILE: /app/hyperbolic-time-chamber/simulations/input/sp_100pct/simulation_v2.json
      HTC_MOBILITY_CITY_MAP_FILE: /app/hyperbolic-time-chamber/simulations/input/sp_100pct/data/city_map.json
      # Optional: enable PT mode choice (bus/subway) — set only if transit_map.json was generated (--transit or --rail flags)
      HTC_MOBILITY_TRANSIT_MAP_FILE: /app/hyperbolic-time-chamber/simulations/input/sp_100pct/data/transit_map.json
      HTC_PERSON_TRUNCATE_SCHEDULE: "true"

      # Cluster Sharding — buffer for msgs queued while ShardCoordinator allocates.
      # Default Pekko value (1000) is too small when progressive loader bursts
      # ~1500+ CreateActor msgs per tick window, causing shard drops.
      HTC_SHARD_BUFFER_SIZE: 100000

      # ── Load Balance Manager ─────────────────────────────────────────────
      # Single-node: disabled. Enable for multi-node beluga runs.
      HTC_LOAD_BALANCE_ENABLED: "false"
      HTC_LOAD_BALANCE_STRATEGY: "default"
      HTC_LB_GEO_AFFINITY_WEIGHT: "0.4"
      HTC_LB_KDTREE_REBALANCE_INTERVAL: "30.0"
      HTC_LB_KDTREE_LOAD_THRESHOLD: "0.85"
      HTC_LB_MIGRATION_MAX_CONCURRENT: "5"

      # ── Migration Window Protocol ────────────────────────────────────────
      HTC_LB_MIGRATION_WINDOW_OPEN_DELAY_MS: "500"
      HTC_LB_MIGRATION_WINDOW_ACK_TIMEOUT_MS: "10000"
      HTC_LB_MIGRATION_RESTORE_ACK_TIMEOUT_MS: "60000"
      HTC_LB_MIGRATION_WINDOW_CLOSE_ACK_TIMEOUT_MS: "10000"
      HTC_LB_MIGRATION_STATE_STORE: "inmemory"

      # Time Manager Configuration
      # 256 TMs total / 32 per node for SP 100% scale (30M+ actors).
      # At peak ~10M active actors: 10M/256 = ~39K actors/TM — well within
      # TICK_BATCH_SIZE=5000 range (8 batches per TM per tick).
      HTC_TIME_MANAGER_INSTANCES: 112
      HTC_TIME_MANAGER_PER_NODE: 112
      HTC_TIME_MANAGER_LOOKAHEAD: 10
      HTC_TIME_MANAGER_WINDOW_SIZE: 20
      HTC_TIME_MANAGER_METRICS_INTERVAL: 500
      HTC_TIME_MANAGER_SNAPSHOT_INTERVAL: 10000
      HTC_TIME_MANAGER_ACTOR_TIMEOUT_MS: 300000
      HTC_TIME_MANAGER_SYNC_TIMEOUT_MS: 60000
      HTC_TIME_MANAGER_STALE_EVENT_MAX_AGE_MS: 60000
      HTC_TIME_MANAGER_HEALTH_CHECK_INTERVAL: 120
      HTC_PLR_RETRY_INTERVAL_SECONDS: "10"
      HTC_PLR_MAX_RETRIES: "360"
      HTC_WARMUP_TARGETS: "org.interscity.htc.model.hybrid.util.CityMapUtil#warmUp"
      
      # JVM Configuration
      # -Xmx: cap at 72GB (leaves 8GB headroom for ZGC off-heap + Netty + OS)
      # -XX:SoftMaxHeapSize: ZGC stays under 64GB at steady state; bursts to 72GB allowed
      # Note: -XX:+ZGenerational is already in the command line; no -Xms so ZGC
      # grows the heap lazily (avoids pre-allocating 48GB × 8 nodes = 384GB at startup).
      JAVA_TOOL_OPTIONS: >-
        -Dconfig.resource=beluga.conf
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
        -Xmx740g

      # Report Manager Configuration
      HTC_REPORT_ENABLED: "false"
      HTC_REPORT_CSV_INSTANCES: 16
      HTC_REPORT_CSV_PER_NODE: 1
      HTC_REPORT_JSON_INSTANCES: 128
      HTC_REPORT_JSON_PER_NODE: 16
      
      # === KAFKA CONFIGURATION ===
      HTC_KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
      HTC_KAFKA_GROUP_ID_SUFFIX: "htc-group"
      HTC_KAFKA_AUTO_OFFSET_RESET: "earliest"
      
      # Kafka Topics
      HTC_KAFKA_EVENTS_TOPIC: "htc.events"
      HTC_KAFKA_REPORTS_TOPIC: "htc.reports" 
      HTC_KAFKA_COMMANDS_TOPIC: "htc.commands"
      HTC_KAFKA_STATE_SYNC_TOPIC: "htc.state-sync"
      HTC_KAFKA_ROUTE_REQUESTS_TOPIC: "htc.route-requests"
      HTC_KAFKA_ROUTE_RESPONSES_TOPIC: "htc.route-responses"
      HTC_KAFKA_STATUS_TOPIC: "htc.status"
      HTC_KAFKA_CUSTOM_REPORTS_TOPIC: "htc.custom-reports"
      
      # Kafka Producer Configuration (optimized for throughput)
      HTC_KAFKA_PRODUCER_ACKS: "all"
      HTC_KAFKA_PRODUCER_RETRIES: "3" 
      HTC_KAFKA_PRODUCER_BATCH_SIZE: "32768"
      HTC_KAFKA_PRODUCER_LINGER_MS: "10"
      HTC_KAFKA_PRODUCER_COMPRESSION_TYPE: "snappy"
      
      # Kafka Consumer Configuration (optimized for performance)
      HTC_KAFKA_MAX_POLL_RECORDS: "1000"
      HTC_KAFKA_ENABLE_AUTO_COMMIT: "true"
      
      # === KAFKA INTEGRATIONS (Enable for production) ===
      HTC_KAFKA_EVENT_STREAMING_ENABLED: "false"
      HTC_KAFKA_EVENT_STREAMING_BATCH_SIZE: "500"
      HTC_KAFKA_EVENT_STREAMING_USE_AVRO: "true"
      
      HTC_KAFKA_REPORTING_ENABLED: "true"
      HTC_KAFKA_REPORTING_BATCH_SIZE: "100" 
      HTC_KAFKA_REPORTING_USE_AVRO: "true"
      
      HTC_KAFKA_STATE_SYNC_ENABLED: "false"
      HTC_KAFKA_STATE_SYNC_INTERVAL: "1000"
      HTC_KAFKA_STATE_SYNC_USE_AVRO: "true"
      
      HTC_KAFKA_COMMAND_CONTROL_ENABLED: "false"
      
      HTC_KAFKA_EXTERNAL_INTEGRATION_ENABLED: "false"
      HTC_KAFKA_EXTERNAL_INTEGRATION_TIMEOUT: "30000"
      
      # High-performance vehicle streaming (Avro only)
      HTC_KAFKA_VEHICLE_STREAMING_ENABLED: "true"
      HTC_KAFKA_VEHICLE_STREAMING_BATCH_SIZE: "2000"
      
      # Ultra high-performance micro simulation streaming (Avro only)  
      HTC_KAFKA_MICRO_SIMULATION_ENABLED: "false"
      HTC_KAFKA_MICRO_SIMULATION_BATCH_SIZE: "5000"
    volumes:
      - /home-ext/fwrocha/phd/simulator:/app/hyperbolic-time-chamber
    deploy:
      resources:
        limits:
          memory: 800G
        reservations:
          memory: 740G

volumes:
  redis_data:
  redpanda_data:

